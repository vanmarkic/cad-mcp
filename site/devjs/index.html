<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>ÉTABLI — Générateur de devis pour menuisier</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23E7E2D8'/%3E%3Crect x='4' y='4' width='24' height='24' fill='none' stroke='%23211D18' stroke-width='2'/%3E%3Ctext x='16' y='22' font-family='Georgia' font-size='14' text-anchor='middle' fill='%23A8631F'%3E%E2%96%9F%E2%96%99%3C/text%3E%3C/svg%3E">
<style>html,body{margin:0;padding:0;background:#E7E2D8}</style>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>
</head>
<body>
<div id="root"></div>

<!-- localStorage-backed shim for the async window.storage API the app expects -->
<script>
window.storage = {
  get: async (key) => {
    try { const v = localStorage.getItem(key); return v == null ? null : { value: v }; }
    catch (e) { return null; }
  },
  set: async (key, value) => {
    try { localStorage.setItem(key, value); } catch (e) {}
  },
};
</script>

<!-- shared, framework-free calculation core (also unit-tested under test/) -->
<script src="lib/etabli-core.js"></script>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, useRef } = React;
const { num, computeLine, tvaBreakdown, calculateCutlist, panelMetrics, cutListText } = window.EtabliCore;

/* =========================================================================
   ÉTABLI — Générateur de devis pour menuisier
   Deux faces d'une même feuille :
   - ATELIER : tout le back-office (coût, marge, métré, bénéfice)
   - DEVIS CLIENT : uniquement ce que le client voit (désignation, qté,
     PU HTVA, total, TVA, acompte). Coût et marge ne sortent jamais.
   ========================================================================= */

/* ---------- helpers ---------- */
/* num() lives in lib/etabli-core.js (shared with the test suite) */
const eur = (n) =>
  new Intl.NumberFormat("fr-BE", { style: "currency", currency: "EUR" }).format(
    isFinite(n) ? n : 0
  );
const pct = (n) =>
  (isFinite(n) ? n : 0).toLocaleString("fr-BE", { maximumFractionDigits: 1 }) + " %";
const todayISO = () => new Date().toISOString().slice(0, 10);
const frDate = (iso) => {
  if (!iso) return "";
  const [y, m, d] = iso.split("-");
  return `${d}/${m}/${y}`;
};
const uid = () => Math.random().toString(36).slice(2, 9);

/* ---------- TVA / client types ---------- */
const TVA_OPTIONS = [
  { v: 6, label: "6 % — rénovation (logement > 10 ans)" },
  { v: 21, label: "21 % — standard / neuf" },
  { v: 12, label: "12 % — cas particuliers" },
];

/* ---------- small inputs (defined outside to keep focus stable) ---------- */
function Field({ label, hint, children, wide }) {
  return (
    <label className={"fld" + (wide ? " fld-wide" : "")}>
      <span className="fld-lab">{label}</span>
      {children}
      {hint ? <span className="fld-hint">{hint}</span> : null}
    </label>
  );
}
function TextIn({ value, onChange, placeholder, mono }) {
  return (
    <input
      className={"in" + (mono ? " in-mono" : "")}
      type="text"
      value={value ?? ""}
      placeholder={placeholder || ""}
      onChange={(e) => onChange(e.target.value)}
    />
  );
}
function NumIn({ value, onChange, placeholder, suffix }) {
  return (
    <span className="numwrap">
      <input
        className="in in-mono in-num"
        type="text"
        inputMode="decimal"
        value={value ?? ""}
        placeholder={placeholder || "0"}
        onChange={(e) => onChange(e.target.value)}
      />
      {suffix ? <span className="numsfx">{suffix}</span> : null}
    </span>
  );
}
function AreaIn({ value, onChange, placeholder }) {
  return (
    <textarea
      className="in in-area"
      rows={2}
      value={value ?? ""}
      placeholder={placeholder || ""}
      onChange={(e) => onChange(e.target.value)}
    />
  );
}

/* ---------- line computation lives in lib/etabli-core.js ---------- */

/* ---------- defaults ---------- */
const DEFAULT_COMPANY = {
  nom: "Menuiserie Jérémie Peeters",
  sousTitre: "Agencement · menuiserie sur mesure",
  adresse: "",
  tva: "BE 0XXX.XXX.XXX",
  iban: "",
  tel: "",
  email: "",
};
const DEFAULT_PARAMS = {
  tauxVente: "55",
  coutHoraire: "35",
  marge: "30",
  tvaRate: 6,
  validite: "30",
  acompte: "30",
  margeCible: "25",
};
const newLine = (type, p) => ({
  id: uid(),
  type,
  designation: "",
  detail: "",
  showDetail: false,
  showQty: true,
  qte: type === "fourniture" ? "1" : "",
  unite: "u",
  pa: "",
  marge: type === "forfait" || type === "fourniture" ? p.marge : "",
  heures: "",
  tauxVente: type === "main" ? p.tauxVente : "",
  coutHoraire: type === "main" ? p.coutHoraire : "",
});
const newDevis = (company, p) => ({
  numero: "DEV-" + new Date().getFullYear() + "-001",
  dateISO: todayISO(),
  client: { nom: "", adresse: "", email: "", tel: "" },
  chantier: "",
  clientType: "particulier", // 'particulier' | 'pro'
  tvaRate: p.tvaRate,
  tvaFournitures: "", // "" = même taux que tvaRate ; sinon taux dédié aux fournitures
  remiseType: "eur",
  remiseVal: "",
  deplacement: "",
  deplacementCout: "",
  acompte: p.acompte,
  validite: p.validite,
  conditions:
    "Devis gratuit, sans engagement. Prix valables pour la durée de validité indiquée. " +
    "Acompte demandé à la commande, solde à la fin du chantier. Délai à confirmer à la signature.",
  lines: [],
});

/* ---------- calepinage (cutlist) ---------- */
const PIECE_PALETTE = [
  "#A8631F", "#3D6B4A", "#2E567C", "#8A5018",
  "#5B4769", "#C08A2E", "#7A5A1C", "#39593F",
];
const newPiece = (i = 0) => ({
  id: uid(),
  label: "",
  w: "",
  h: "",
  qty: "1",
  color: PIECE_PALETTE[i % PIECE_PALETTE.length],
});
// Un « matériau » = un type de panneau (cote + prix au m² + sens du fil) avec sa
// propre liste de pièces. Un calepinage peut en empiler plusieurs (p. ex. MDF
// 18 mm à 30 €/m² ET aglo 8 mm à 15 €/m²) : chacun se débite sur SES plaques —
// on ne mélange jamais deux matières sur une même plaque — et chacun produit sa
// propre ligne de devis. Tout est en millimètres ; le prix matière est au m².
const newMaterial = (i = 0) => ({
  id: uid(),
  material: "",
  pricePerM2: "",
  panelW: "2500",
  panelH: "1250",
  kerf: "3",
  grainDirection: false,
  pieces: [],
});
const FIRST_MATERIAL = newMaterial(0);
const DEFAULT_CALEP = { materials: [FIRST_MATERIAL], activeId: FIRST_MATERIAL.id };

// Mise à niveau du format stocké. L'ancien atelier ne gardait qu'un seul
// panneau (`{ material, panelW, …, pieces }`) ; on l'enveloppe dans la liste
// `materials` pour ne rien perdre des devis déjà commencés.
function migrateCalep(raw) {
  if (!raw || typeof raw !== "object") return { materials: [newMaterial(0)], activeId: null };
  let materials;
  if (Array.isArray(raw.materials)) {
    materials = raw.materials.map((m, i) => ({
      ...newMaterial(i),
      ...m,
      id: m && m.id ? m.id : uid(),
      pieces: Array.isArray(m && m.pieces) ? m.pieces : [],
    }));
  } else {
    materials = [{
      ...newMaterial(0),
      material: raw.material != null ? raw.material : "",
      pricePerM2: raw.pricePerM2 != null ? raw.pricePerM2 : "",
      panelW: raw.panelW != null ? raw.panelW : "2500",
      panelH: raw.panelH != null ? raw.panelH : "1250",
      kerf: raw.kerf != null ? raw.kerf : "3",
      grainDirection: !!raw.grainDirection,
      pieces: Array.isArray(raw.pieces) ? raw.pieces : [],
    }];
  }
  if (!materials.length) materials = [newMaterial(0)];
  const activeId = materials.some((m) => m.id === raw.activeId) ? raw.activeId : materials[0].id;
  return { materials, activeId };
}

const nf1 = (n) => (isFinite(n) ? n : 0).toLocaleString("fr-BE", { maximumFractionDigits: 1 });

// Calepinage + métrique d'UN matériau (pur, sans DOM) : on convertit les
// champs de saisie (w/h/qty en chaînes) vers le noyau, puis on délègue tout le
// calcul à etabli-core (source unique de vérité).
function computeMaterial(mat) {
  const config = {
    width: num(mat.panelW),
    height: num(mat.panelH),
    kerf: num(mat.kerf),
    grainDirection: !!mat.grainDirection,
  };
  const piecesForCore = mat.pieces.map((p) => ({
    id: p.id, label: p.label,
    width: num(p.w), height: num(p.h), quantity: num(p.qty), color: p.color,
  }));
  const result = calculateCutlist(piecesForCore, config);
  const metrics = panelMetrics(result, config, num(mat.pricePerM2), 0.001);
  const cutList = cutListText(piecesForCore, { unit: "mm" });
  const hasPieces = piecesForCore.some((p) => p.width > 0 && p.height > 0 && p.quantity > 0);
  return { id: mat.id, config, piecesForCore, result, metrics, cutList, hasPieces };
}

// Ligne « fourniture » correspondant à un matériau calepiné : N panneaux entiers
// au coût/panneau, avec la liste de débit pliée dans le métré.
function buildCalepLine(mat, comp, marge) {
  const { metrics, cutList } = comp;
  const detail = [
    `${metrics.totalSheets} panneau(x) ${num(mat.panelW)}×${num(mat.panelH)} mm — chute ${nf1(metrics.totalWastePercent)} %`,
    cutList.text,
  ].join("\n");
  return {
    id: uid(),
    type: "fourniture",
    designation: (mat.material || "Panneau") + " — débit calepiné",
    detail,
    showDetail: true,
    showQty: true,
    qte: String(metrics.totalSheets),
    unite: "panneau",
    pa: (Math.round(metrics.costPerPanel * 100) / 100).toString(),
    marge,
    heures: "",
    tauxVente: "",
    coutHoraire: "",
  };
}

/* =========================================================================
   APP
   ========================================================================= */
function App() {
  const [view, setView] = useState("atelier"); // 'atelier' | 'client'
  const [company, setCompany] = useState(DEFAULT_COMPANY);
  const [params, setParams] = useState(DEFAULT_PARAMS);
  const [devis, setDevis] = useState(() => newDevis(DEFAULT_COMPANY, DEFAULT_PARAMS));
  const [saved, setSaved] = useState([]);
  const [modal, setModal] = useState(null); // 'reglages' | 'mesdevis' | 'calepinage' | null
  const [toast, setToast] = useState("");
  const [calep, setCalep] = useState(DEFAULT_CALEP);
  const loaded = useRef(false);

  /* load persisted state */
  useEffect(() => {
    (async () => {
      try {
        if (typeof window !== "undefined" && window.storage) {
          const s = await window.storage.get("etabli:settings").catch(() => null);
          if (s && s.value) {
            const parsed = JSON.parse(s.value);
            if (parsed.company) setCompany((c) => ({ ...c, ...parsed.company }));
            if (parsed.params) setParams((p) => ({ ...p, ...parsed.params }));
          }
          const q = await window.storage.get("etabli:quotes").catch(() => null);
          if (q && q.value) setSaved(JSON.parse(q.value) || []);
          const cp = await window.storage.get("etabli:calepinage").catch(() => null);
          if (cp && cp.value) setCalep(migrateCalep(JSON.parse(cp.value)));
        }
      } catch (e) {
        /* ignore — first run */
      } finally {
        loaded.current = true;
      }
    })();
  }, []);

  /* persist the calepinage workbench whenever it changes (after first load) */
  useEffect(() => {
    if (!loaded.current) return;
    try {
      if (window.storage)
        window.storage.set("etabli:calepinage", JSON.stringify(calep));
    } catch (e) {}
  }, [calep]);

  const flash = (m) => {
    setToast(m);
    setTimeout(() => setToast(""), 2200);
  };

  const persistSettings = async (c, p) => {
    try {
      if (window.storage)
        await window.storage.set(
          "etabli:settings",
          JSON.stringify({ company: c, params: p })
        );
    } catch (e) {}
  };
  const persistQuotes = async (list) => {
    try {
      if (window.storage)
        await window.storage.set("etabli:quotes", JSON.stringify(list));
    } catch (e) {}
  };

  /* ---------- totals ---------- */
  const calc = useMemo(() => {
    let cout = 0;
    let venteHT = 0;
    const rows = devis.lines.map((l) => {
      const c = computeLine(l);
      cout += c.cout;
      venteHT += c.vente;
      // Keep computed values on DISTINCT keys (qteNum / uniteOut / margeEur).
      // Spreading c directly used to overwrite the raw text inputs the LineCard
      // is bound to (qte / unite / marge) — so typing a digit made another value
      // appear. The raw strings from `l` must survive untouched.
      return {
        ...l,
        cout: c.cout,
        vente: c.vente,
        puv: c.puv,
        qteNum: c.qte,
        uniteOut: c.unite,
        margeEur: c.vente - c.cout,
      };
    });
    const remise =
      devis.remiseType === "pct"
        ? venteHT * (num(devis.remiseVal) / 100)
        : num(devis.remiseVal);
    const deplacement = num(devis.deplacement);
    const coutTotal = cout + num(devis.deplacementCout);

    // Taux effectif par poste : pro (cocontractant) → 0 partout ; sinon les
    // fournitures prennent leur taux dédié si défini, le reste suit le taux
    // principal (la « facture finale »). Le déplacement suit le taux principal.
    const coco = devis.clientType === "pro";
    const mainRate = num(devis.tvaRate);
    const fournRate =
      devis.tvaFournitures === "" || devis.tvaFournitures == null
        ? null
        : num(devis.tvaFournitures);
    const taxRows = rows.map((l) => ({
      vente: l.vente,
      rate: coco ? 0 : l.type === "fourniture" && fournRate != null ? fournRate : mainRate,
    }));
    const t = tvaBreakdown(taxRows, {
      remise,
      deplacement,
      deplacementRate: coco ? 0 : mainRate,
    });
    // Toujours au moins un groupe à afficher (devis vide → taux principal à 0 €).
    const tvaGroups = t.groups.length
      ? t.groups
      : [{ rate: coco ? 0 : mainRate, base: 0, tva: 0 }];
    const baseHT = t.baseHT;
    const tva = t.tva;
    const ttc = t.ttc;
    const marge = baseHT - coutTotal;
    const margePct = baseHT > 0 ? (marge / baseHT) * 100 : 0;
    const acompte = ttc * (num(devis.acompte) / 100);
    return {
      rows,
      coutTotal,
      venteHT,
      remise,
      deplacement,
      baseHT,
      coco,
      tvaGroups,
      tvaMixed: tvaGroups.length > 1,
      tva,
      ttc,
      marge,
      margePct,
      acompte,
    };
  }, [devis]);

  const margeColor = (p) => {
    const cible = num(params.margeCible);
    if (p >= cible) return "var(--green)";
    if (p >= cible * 0.5) return "var(--amber)";
    return "var(--brick)";
  };

  /* ---------- mutations ---------- */
  const setLine = (id, patch) =>
    setDevis((d) => ({
      ...d,
      lines: d.lines.map((l) => (l.id === id ? { ...l, ...patch } : l)),
    }));
  const addLine = (type) =>
    setDevis((d) => ({ ...d, lines: [...d.lines, newLine(type, params)] }));
  const delLine = (id) =>
    setDevis((d) => ({ ...d, lines: d.lines.filter((l) => l.id !== id) }));
  const moveLine = (id, dir) =>
    setDevis((d) => {
      const i = d.lines.findIndex((l) => l.id === id);
      const j = i + dir;
      if (i < 0 || j < 0 || j >= d.lines.length) return d;
      const arr = [...d.lines];
      [arr[i], arr[j]] = [arr[j], arr[i]];
      return { ...d, lines: arr };
    });

  const saveQuote = () => {
    setSaved((list) => {
      const idx = list.findIndex((x) => x.numero === devis.numero);
      const stamped = { ...devis, _savedAt: new Date().toISOString() };
      const next =
        idx >= 0
          ? list.map((x, i) => (i === idx ? stamped : x))
          : [stamped, ...list];
      persistQuotes(next);
      return next;
    });
    flash("Devis enregistré : " + devis.numero);
  };
  const loadQuote = (q) => {
    setDevis(JSON.parse(JSON.stringify(q)));
    setModal(null);
    setView("atelier");
    flash("Devis chargé : " + q.numero);
  };
  const deleteQuote = (numero) =>
    setSaved((list) => {
      const next = list.filter((x) => x.numero !== numero);
      persistQuotes(next);
      return next;
    });
  const resetQuote = () => {
    setDevis(newDevis(company, params));
    setModal(null);
    flash("Nouveau devis");
  };

  const doPrint = () => {
    setView("client");
    setTimeout(() => window.print(), 350);
  };

  /* ---------- calepinage → devis ---------- */
  // Adds one or several "fourniture" lines (one per calepiné material): N whole
  // panels at the per-panel cost, with the cut list folded into the metré detail.
  const addCalepToDevis = (lineOrLines) => {
    const lines = Array.isArray(lineOrLines) ? lineOrLines : [lineOrLines];
    if (!lines.length) return;
    setDevis((d) => ({ ...d, lines: [...d.lines, ...lines] }));
    setModal(null);
    setView("atelier");
    flash(lines.length > 1 ? `${lines.length} lignes ajoutées au devis` : "Calepinage ajouté au devis");
  };

  /* ============================ RENDER ============================ */
  return (
    <div className="app">
      <style>{CSS}</style>

      {/* top bar */}
      <header className="bar no-print">
        <div className="brand">
          <div className="brand-mark">▟▙</div>
          <div>
            <div className="brand-name">ÉTABLI</div>
            <div className="brand-sub">devis de menuiserie · atelier &amp; client</div>
          </div>
        </div>

        <div className="flip" role="tablist" aria-label="Vue">
          <button
            className={"flip-btn" + (view === "atelier" ? " on" : "")}
            onClick={() => setView("atelier")}
          >
            Atelier
          </button>
          <button
            className={"flip-btn" + (view === "client" ? " on" : "")}
            onClick={() => setView("client")}
          >
            Devis client
          </button>
        </div>

        <div className="bar-actions">
          <button className="btn ghost" onClick={() => setModal("calepinage")}>
            Calepinage
          </button>
          <button className="btn ghost" onClick={() => setModal("reglages")}>
            Réglages
          </button>
          <button className="btn ghost" onClick={() => setModal("mesdevis")}>
            Mes devis {saved.length ? `(${saved.length})` : ""}
          </button>
          <button className="btn ghost" onClick={resetQuote}>
            Nouveau
          </button>
          <button className="btn" onClick={saveQuote}>
            Enregistrer
          </button>
        </div>
      </header>

      {view === "atelier" ? (
        <Atelier
          devis={devis}
          setDevis={setDevis}
          params={params}
          calc={calc}
          setLine={setLine}
          addLine={addLine}
          delLine={delLine}
          moveLine={moveLine}
          margeColor={margeColor}
        />
      ) : (
        <ClientSheet
          devis={devis}
          company={company}
          calc={calc}
          onPrint={doPrint}
        />
      )}

      {/* ---------- modals ---------- */}
      {modal === "calepinage" && (
        <Modal title="Calepinage — débit de panneaux" onClose={() => setModal(null)} wide>
          <Calepinage
            calep={calep}
            setCalep={setCalep}
            params={params}
            onAddToDevis={addCalepToDevis}
            flash={flash}
          />
        </Modal>
      )}
      {modal === "reglages" && (
        <Modal title="Réglages" onClose={() => setModal(null)} wide>
          <Reglages
            company={company}
            params={params}
            onSave={(c, p) => {
              setCompany(c);
              setParams(p);
              persistSettings(c, p);
              setModal(null);
              flash("Réglages enregistrés");
            }}
          />
        </Modal>
      )}
      {modal === "mesdevis" && (
        <Modal title="Mes devis" onClose={() => setModal(null)}>
          {saved.length === 0 ? (
            <p className="muted">
              Aucun devis enregistré pour l'instant. Clique sur « Enregistrer »
              pour garder un devis ici.
            </p>
          ) : (
            <ul className="qlist">
              {saved.map((q) => (
                <li key={q.numero} className="qrow">
                  <div>
                    <div className="qrow-num">{q.numero}</div>
                    <div className="qrow-meta">
                      {q.client?.nom || "Client —"} · {frDate(q.dateISO)} ·{" "}
                      {q.lines?.length || 0} ligne(s)
                    </div>
                  </div>
                  <div className="qrow-act">
                    <button className="btn sm" onClick={() => loadQuote(q)}>
                      Charger
                    </button>
                    <button
                      className="btn sm danger"
                      onClick={() => deleteQuote(q.numero)}
                    >
                      Suppr.
                    </button>
                  </div>
                </li>
              ))}
            </ul>
          )}
        </Modal>
      )}

      {toast ? <div className="toast no-print">{toast}</div> : null}
    </div>
  );
}

/* =========================================================================
   ATELIER (back-office)
   ========================================================================= */
function Atelier({
  devis,
  setDevis,
  params,
  calc,
  setLine,
  addLine,
  delLine,
  moveLine,
  margeColor,
}) {
  const set = (patch) => setDevis((d) => ({ ...d, ...patch }));
  const setClient = (patch) =>
    setDevis((d) => ({ ...d, client: { ...d.client, ...patch } }));

  return (
    <main className="wrap no-print">
      {/* meta + client */}
      <section className="card">
        <div className="card-eyebrow">01 — Chantier &amp; client</div>
        <div className="grid">
          <Field label="N° de devis">
            <TextIn value={devis.numero} onChange={(v) => set({ numero: v })} mono />
          </Field>
          <Field label="Date">
            <TextIn value={devis.dateISO} onChange={(v) => set({ dateISO: v })} mono />
          </Field>
          <Field label="Validité (jours)">
            <NumIn value={devis.validite} onChange={(v) => set({ validite: v })} suffix="j" />
          </Field>
          <Field label="Client">
            <TextIn
              value={devis.client.nom}
              onChange={(v) => setClient({ nom: v })}
              placeholder="Nom / société"
            />
          </Field>
          <Field label="Téléphone">
            <TextIn value={devis.client.tel} onChange={(v) => setClient({ tel: v })} />
          </Field>
          <Field label="E-mail">
            <TextIn value={devis.client.email} onChange={(v) => setClient({ email: v })} />
          </Field>
          <Field label="Adresse du chantier" wide>
            <TextIn
              value={devis.client.adresse}
              onChange={(v) => setClient({ adresse: v })}
            />
          </Field>
          <Field label="Description du chantier" wide>
            <TextIn
              value={devis.chantier}
              onChange={(v) => set({ chantier: v })}
              placeholder="Ex. fabrication et pose d'un dressing sur mesure"
            />
          </Field>
        </div>
      </section>

      {/* lines */}
      <section className="card">
        <div className="card-eyebrow">02 — Bordereau &amp; métré</div>
        <p className="muted tip">
          Tout ce que tu encodes ici reste à l'atelier. Le client ne verra ni le
          coût d'achat, ni le coût horaire, ni la marge — seulement la désignation,
          la quantité et le prix de vente.
        </p>

        {devis.lines.length === 0 && (
          <div className="empty">
            Aucune ligne. Ajoute une fourniture, de la main-d'œuvre ou un forfait
            ci-dessous.
          </div>
        )}

        <div className="lines">
          {calc.rows.map((l, i) => (
            <LineCard
              key={l.id}
              line={l}
              index={i}
              last={i === devis.lines.length - 1}
              setLine={setLine}
              delLine={delLine}
              moveLine={moveLine}
              margeColor={margeColor}
            />
          ))}
        </div>

        <div className="add-row">
          <button className="btn add" onClick={() => addLine("fourniture")}>
            + Fourniture
          </button>
          <button className="btn add" onClick={() => addLine("main")}>
            + Main-d'œuvre
          </button>
          <button className="btn add" onClick={() => addLine("forfait")}>
            + Forfait / sous-traitance
          </button>
        </div>
      </section>

      {/* adjustments */}
      <section className="card">
        <div className="card-eyebrow">03 — Ajustements</div>
        <div className="grid">
          <Field label="Remise">
            <div className="remise">
              <select
                className="in in-sel"
                value={devis.remiseType}
                onChange={(e) => set({ remiseType: e.target.value })}
              >
                <option value="eur">€</option>
                <option value="pct">%</option>
              </select>
              <NumIn value={devis.remiseVal} onChange={(v) => set({ remiseVal: v })} />
            </div>
          </Field>
          <Field label="Déplacement — prix client" hint="HTVA, visible sur le devis">
            <NumIn value={devis.deplacement} onChange={(v) => set({ deplacement: v })} suffix="€" />
          </Field>
          <Field label="Déplacement — coût réel" hint="atelier uniquement">
            <NumIn
              value={devis.deplacementCout}
              onChange={(v) => set({ deplacementCout: v })}
              suffix="€"
            />
          </Field>
          <Field label="Type de client">
            <select
              className="in in-sel"
              value={devis.clientType}
              onChange={(e) => set({ clientType: e.target.value })}
            >
              <option value="particulier">Particulier (TVA appliquée)</option>
              <option value="pro">Professionnel (cocontractant)</option>
            </select>
          </Field>
          {devis.clientType === "particulier" && (
            <Field label="Taux de TVA" hint="taux principal — main-d'œuvre, forfaits, déplacement">
              <select
                className="in in-sel"
                value={devis.tvaRate}
                onChange={(e) => set({ tvaRate: Number(e.target.value) })}
              >
                {TVA_OPTIONS.map((o) => (
                  <option key={o.v} value={o.v}>
                    {o.label}
                  </option>
                ))}
              </select>
            </Field>
          )}
          {devis.clientType === "particulier" && (
            <Field label="TVA fournitures" hint="vide = même taux que ci-dessus (ex. 21 % matériel, 6 % chantier)">
              <select
                className="in in-sel"
                value={devis.tvaFournitures ?? ""}
                onChange={(e) =>
                  set({ tvaFournitures: e.target.value === "" ? "" : Number(e.target.value) })
                }
              >
                <option value="">Même taux ({num(devis.tvaRate)} %)</option>
                {TVA_OPTIONS.map((o) => (
                  <option key={o.v} value={o.v}>
                    {o.label}
                  </option>
                ))}
              </select>
            </Field>
          )}
          <Field label="Acompte à la commande">
            <NumIn value={devis.acompte} onChange={(v) => set({ acompte: v })} suffix="%" />
          </Field>
          <Field label="Conditions (bas de devis)" wide>
            <AreaIn value={devis.conditions} onChange={(v) => set({ conditions: v })} />
          </Field>
        </div>
      </section>

      {/* atelier summary */}
      <section className="card summary">
        <div className="card-eyebrow">04 — Vue atelier</div>
        <div className="sum-grid">
          <Stat label="Coût de revient" value={eur(calc.coutTotal)} muted />
          <Stat label="Vente HTVA" value={eur(calc.baseHT)} />
          <Stat
            label="Marge"
            value={eur(calc.marge)}
            sub={pct(calc.margePct)}
            color={margeColor(calc.margePct)}
            big
          />
          <Stat label="Bénéfice estimé" value={eur(calc.marge)} color={margeColor(calc.margePct)} />
        </div>
        <div className="margebar">
          <div
            className="margebar-fill"
            style={{
              width: Math.min(100, Math.max(2, calc.margePct)) + "%",
              background: margeColor(calc.margePct),
            }}
          />
          <span className="margebar-lab">
            Marge {pct(calc.margePct)} · cible {pct(num(params.margeCible))}
          </span>
        </div>

        <div className="sum-tot">
          <Row k="Total HTVA" v={eur(calc.baseHT)} />
          {calc.coco ? (
            <Row k="TVA — autoliquidation (0 %)" v={eur(0)} />
          ) : (
            calc.tvaGroups.map((g) => (
              <Row
                key={g.rate}
                k={calc.tvaMixed ? `TVA ${g.rate} % (sur ${eur(g.base)})` : `TVA ${g.rate} %`}
                v={eur(g.tva)}
              />
            ))
          )}
          <Row k="Total TVAC" v={eur(calc.ttc)} strong />
          <Row k={`Acompte (${num(devis.acompte)} %)`} v={eur(calc.acompte)} />
        </div>
      </section>
    </main>
  );
}

function Stat({ label, value, sub, color, big, muted }) {
  return (
    <div className={"stat" + (big ? " stat-big" : "")}>
      <div className="stat-lab">{label}</div>
      <div className="stat-val" style={{ color: color || (muted ? "var(--ink-3)" : "var(--ink)") }}>
        {value}
      </div>
      {sub ? <div className="stat-sub" style={{ color }}>{sub}</div> : null}
    </div>
  );
}
function Row({ k, v, strong }) {
  return (
    <div className={"trow" + (strong ? " trow-strong" : "")}>
      <span>{k}</span>
      <span className="mono">{v}</span>
    </div>
  );
}

/* ---------- single line card ---------- */
function LineCard({ line, index, last, setLine, delLine, moveLine, margeColor }) {
  const l = line;
  const typeLabel =
    l.type === "main" ? "Main-d'œuvre" : l.type === "forfait" ? "Forfait" : "Fourniture";
  return (
    <div className="line">
      <div className="line-head">
        <span className={"chip chip-" + l.type}>{typeLabel}</span>
        <input
          className="in line-title"
          type="text"
          placeholder="Désignation (ex. plateau chêne massif 40 mm)"
          value={l.designation}
          onChange={(e) => setLine(l.id, { designation: e.target.value })}
        />
        <div className="line-ord">
          <button className="ico" title="Monter" disabled={index === 0} onClick={() => moveLine(l.id, -1)}>
            ↑
          </button>
          <button className="ico" title="Descendre" disabled={last} onClick={() => moveLine(l.id, 1)}>
            ↓
          </button>
          <button className="ico ico-del" title="Supprimer" onClick={() => delLine(l.id)}>
            ✕
          </button>
        </div>
      </div>

      <div className="line-body">
        {l.type === "fourniture" && (
          <>
            <Field label="Quantité (métré)">
              <NumIn value={l.qte} onChange={(v) => setLine(l.id, { qte: v })} />
            </Field>
            <Field label="Unité">
              <TextIn value={l.unite} onChange={(v) => setLine(l.id, { unite: v })} placeholder="m², ml, pce…" />
            </Field>
            <Field label="Prix d'achat / u" hint="HTVA — atelier">
              <NumIn value={l.pa} onChange={(v) => setLine(l.id, { pa: v })} suffix="€" />
            </Field>
            <Field label="Marge">
              <NumIn value={l.marge} onChange={(v) => setLine(l.id, { marge: v })} suffix="%" />
            </Field>
          </>
        )}
        {l.type === "main" && (
          <>
            <Field label="Heures">
              <NumIn value={l.heures} onChange={(v) => setLine(l.id, { heures: v })} suffix="h" />
            </Field>
            <Field label="Taux facturé / h" hint="prix client">
              <NumIn value={l.tauxVente} onChange={(v) => setLine(l.id, { tauxVente: v })} suffix="€" />
            </Field>
            <Field label="Coût horaire / h" hint="atelier">
              <NumIn value={l.coutHoraire} onChange={(v) => setLine(l.id, { coutHoraire: v })} suffix="€" />
            </Field>
          </>
        )}
        {l.type === "forfait" && (
          <>
            <Field label="Coût / achat" hint="HTVA — atelier">
              <NumIn value={l.pa} onChange={(v) => setLine(l.id, { pa: v })} suffix="€" />
            </Field>
            <Field label="Marge">
              <NumIn value={l.marge} onChange={(v) => setLine(l.id, { marge: v })} suffix="%" />
            </Field>
          </>
        )}
      </div>

      {/* per-line metré detail */}
      <div className="line-detail">
        <AreaIn
          value={l.detail}
          onChange={(v) => setLine(l.id, { detail: v })}
          placeholder="Métré / détail (ex. 3,20 × 2,10 m — façade + 2 portes). Visible sur le devis seulement si la case est cochée."
        />
      </div>

      <div className="line-foot">
        <div className="toggles">
          <label className="tog">
            <input
              type="checkbox"
              checked={!!l.showQty}
              onChange={(e) => setLine(l.id, { showQty: e.target.checked })}
            />
            Détailler qté/PU sur le devis
          </label>
          <label className="tog">
            <input
              type="checkbox"
              checked={!!l.showDetail}
              onChange={(e) => setLine(l.id, { showDetail: e.target.checked })}
            />
            Afficher le métré sur le devis
          </label>
        </div>
        <div className="line-figs">
          <span className="fig">
            Coût <b className="mono">{eur(l.cout)}</b>
          </span>
          <span className="fig" style={{ color: margeColor(l.vente > 0 ? (l.margeEur / l.vente) * 100 : 0) }}>
            Marge <b className="mono">{eur(l.margeEur)}</b>
          </span>
          <span className="fig fig-sell">
            Vente HTVA <b className="mono">{eur(l.vente)}</b>
          </span>
        </div>
      </div>
    </div>
  );
}

/* =========================================================================
   CALEPINAGE — débit de panneaux (cutlist)
   ========================================================================= */
function SheetSVG({ layout, panelW, panelH, index }) {
  // viewBox en mm ; le CSS gère la taille affichée.
  const fs = Math.max(panelW, panelH) / 40; // taille de texte (unités mm)
  const sw = Math.max(panelW, panelH) / 350; // épaisseur de trait (unités mm)
  const nf1 = (n) => (isFinite(n) ? n : 0).toLocaleString("fr-BE", { maximumFractionDigits: 1 });
  return (
    <figure className="cl-sheet">
      <figcaption className="cl-sheet-cap">
        Panneau {index + 1} · chute {nf1(layout.wastePercent)} %
      </figcaption>
      <svg className="cl-svg" viewBox={`0 0 ${panelW} ${panelH}`} preserveAspectRatio="xMidYMid meet">
        <rect x={0} y={0} width={panelW} height={panelH} className="cl-panel" />
        {layout.pieces.map((p, i) => (
          <g key={i}>
            <rect
              x={p.x} y={p.y} width={p.width} height={p.height}
              fill={p.color} fillOpacity={0.5} stroke={p.color} strokeWidth={sw}
            />
            <text
              x={p.x + p.width / 2} y={p.y + p.height / 2}
              fontSize={fs} textAnchor="middle" dominantBaseline="central"
              className="cl-piece-lab"
            >
              <tspan x={p.x + p.width / 2} dy={-fs * 0.15}>{p.label || "—"}</tspan>
              <tspan x={p.x + p.width / 2} dy={fs * 1.1}>
                {Math.round(p.width)}×{Math.round(p.height)}{p.rotated ? " ↻" : ""}
              </tspan>
            </text>
          </g>
        ))}
      </svg>
    </figure>
  );
}

function Calepinage({ calep, setCalep, params, onAddToDevis, flash }) {
  // Liste des matériaux + matériau actif (avec garde si l'état est incomplet).
  const materials = calep.materials && calep.materials.length ? calep.materials : [newMaterial(0)];
  const activeId = materials.some((m) => m.id === calep.activeId) ? calep.activeId : materials[0].id;
  const activeMat = materials.find((m) => m.id === activeId) || materials[0];

  // Mutations ciblant le matériau actif.
  const setMat = (patch) =>
    setCalep((c) => ({ ...c, materials: c.materials.map((m) => (m.id === activeId ? { ...m, ...patch } : m)) }));
  const setPiece = (id, patch) =>
    setCalep((c) => ({
      ...c,
      materials: c.materials.map((m) =>
        m.id === activeId ? { ...m, pieces: m.pieces.map((p) => (p.id === id ? { ...p, ...patch } : p)) } : m
      ),
    }));
  const addPiece = () =>
    setCalep((c) => ({
      ...c,
      materials: c.materials.map((m) =>
        m.id === activeId ? { ...m, pieces: [...m.pieces, newPiece(m.pieces.length)] } : m
      ),
    }));
  const delPiece = (id) =>
    setCalep((c) => ({
      ...c,
      materials: c.materials.map((m) =>
        m.id === activeId ? { ...m, pieces: m.pieces.filter((p) => p.id !== id) } : m
      ),
    }));

  // Gestion des matériaux (onglets).
  const selectMat = (id) => setCalep((c) => ({ ...c, activeId: id }));
  const addMaterial = () =>
    setCalep((c) => {
      const m = newMaterial(c.materials.length);
      return { ...c, materials: [...c.materials, m], activeId: m.id };
    });
  const delMaterial = (id) =>
    setCalep((c) => {
      if (c.materials.length <= 1) return c; // on garde toujours au moins un matériau
      const left = c.materials.filter((m) => m.id !== id);
      return { ...c, materials: left, activeId: c.activeId === id ? left[0].id : c.activeId };
    });

  // Calcul de TOUS les matériaux (pour les badges d'onglet + le total général),
  // puis on isole le matériau actif pour l'éditeur ci-dessous.
  const computed = useMemo(() => materials.map(computeMaterial), [materials]);
  const compById = (id) => computed.find((c) => c.id === id) || computeMaterial(activeMat);
  const active = compById(activeId);
  const { result, metrics, cutList, hasPieces } = active;

  // Total tous matériaux confondus (uniquement ceux qui consomment ≥ 1 panneau).
  const grand = useMemo(() => {
    let sheets = 0, cost = 0, lines = 0;
    computed.forEach((c) => {
      if (c.metrics.totalSheets > 0) { sheets += c.metrics.totalSheets; cost += c.metrics.totalCost; lines += 1; }
    });
    return { sheets, cost, lines };
  }, [computed]);

  const copyList = async () => {
    try {
      await navigator.clipboard.writeText(cutList.text);
      flash("Liste de débit copiée");
    } catch (e) {
      flash("Sélectionne le texte puis Ctrl+C");
    }
  };

  const addActiveToDevis = () => {
    if (metrics.totalSheets === 0) return;
    onAddToDevis(buildCalepLine(activeMat, active, params.marge));
  };
  const addAllToDevis = () => {
    const lines = [];
    materials.forEach((m) => {
      const c = compById(m.id);
      if (c.metrics.totalSheets > 0) lines.push(buildCalepLine(m, c, params.marge));
    });
    if (lines.length) onAddToDevis(lines);
  };

  return (
    <div className="cl">
      <p className="muted tip">
        Les panneaux s'achètent entiers. Ajoute un matériau par type de panneau
        (ex. MDF 18 mm à 30 €/m², aglo blanc 8 mm à 15 €/m²) : chacun se débite sur
        ses propres plaques et crée sa propre ligne de devis. Pour chaque matière,
        indique la cote et le prix au m², puis liste les pièces (longueur × largeur, en mm).
      </p>

      {/* onglets matériaux */}
      <div className="cl-mats">
        {materials.map((m, i) => {
          const c = compById(m.id);
          return (
            <button
              key={m.id}
              type="button"
              className={"cl-mat" + (m.id === activeId ? " active" : "")}
              onClick={() => selectMat(m.id)}
            >
              <span className="cl-mat-name">{m.material || `Matière ${i + 1}`}</span>
              <span className="cl-mat-badge">{c.metrics.totalSheets > 0 ? `${c.metrics.totalSheets} pann.` : "—"}</span>
              {materials.length > 1 && (
                <span
                  className="cl-mat-x"
                  title="Supprimer ce matériau"
                  role="button"
                  onClick={(e) => { e.stopPropagation(); delMaterial(m.id); }}
                >✕</span>
              )}
            </button>
          );
        })}
        <button type="button" className="btn add cl-mat-add" onClick={addMaterial}>+ Matière</button>
      </div>

      {/* stock + matière (matériau actif) */}
      <div className="card-eyebrow">Panneau &amp; matière</div>
      <div className="grid">
        <Field label="Matière / désignation" wide>
          <TextIn value={activeMat.material} onChange={(v) => setMat({ material: v })} placeholder="Ex. MDF 18 mm, aglo blanc 8 mm…" />
        </Field>
        <Field label="Longueur panneau">
          <NumIn value={activeMat.panelW} onChange={(v) => setMat({ panelW: v })} suffix="mm" />
        </Field>
        <Field label="Largeur panneau">
          <NumIn value={activeMat.panelH} onChange={(v) => setMat({ panelH: v })} suffix="mm" />
        </Field>
        <Field label="Prix matière" hint="HTVA, au m²">
          <NumIn value={activeMat.pricePerM2} onChange={(v) => setMat({ pricePerM2: v })} suffix="€/m²" />
        </Field>
        <Field label="Trait de scie">
          <NumIn value={activeMat.kerf} onChange={(v) => setMat({ kerf: v })} suffix="mm" />
        </Field>
        <Field label="Sens du fil">
          <label className="tog cl-tog">
            <input
              type="checkbox"
              checked={!!activeMat.grainDirection}
              onChange={(e) => setMat({ grainDirection: e.target.checked })}
            />
            Bloquer la rotation
          </label>
        </Field>
      </div>

      {/* pièces (matériau actif) */}
      <div className="card-eyebrow mt">Pièces à débiter</div>
      {activeMat.pieces.length === 0 && (
        <div className="empty">Aucune pièce. Ajoute les pièces à découper ci-dessous.</div>
      )}
      {activeMat.pieces.length > 0 && (
        <div className="cl-pieces">
          <div className="cl-prow cl-prow-head">
            <span>Désignation</span><span>Long.</span><span>Larg.</span><span>Qté</span><span></span>
          </div>
          {activeMat.pieces.map((p) => (
            <div className="cl-prow" key={p.id}>
              <span className="cl-swatch-wrap">
                <span className="cl-swatch" style={{ background: p.color }} />
                <input className="in" type="text" value={p.label} placeholder="Ex. côté, étagère…"
                  onChange={(e) => setPiece(p.id, { label: e.target.value })} />
              </span>
              <input className="in in-mono in-num" inputMode="decimal" value={p.w} placeholder="0"
                onChange={(e) => setPiece(p.id, { w: e.target.value })} />
              <input className="in in-mono in-num" inputMode="decimal" value={p.h} placeholder="0"
                onChange={(e) => setPiece(p.id, { h: e.target.value })} />
              <input className="in in-mono in-num" inputMode="decimal" value={p.qty} placeholder="1"
                onChange={(e) => setPiece(p.id, { qty: e.target.value })} />
              <button className="ico ico-del" title="Supprimer" onClick={() => delPiece(p.id)}>✕</button>
            </div>
          ))}
        </div>
      )}
      <div className="add-row">
        <button className="btn add" onClick={addPiece}>+ Ajouter une pièce</button>
      </div>

      {/* résultats (matériau actif) */}
      {hasPieces && result && (
        <>
          <div className="card-eyebrow mt">Résultat — {activeMat.material || `Matière ${materials.indexOf(activeMat) + 1}`}</div>
          <div className="sum-grid cl-stats">
            <Stat label="Panneaux à acheter" value={String(metrics.totalSheets)} big />
            <Stat label="Chute" value={nf1(metrics.totalWastePercent) + " %"} />
            <Stat label="Coût / panneau" value={eur(metrics.costPerPanel)} muted />
            <Stat label="Coût matière total" value={eur(metrics.totalCost)} color="var(--oak-2)" />
          </div>

          {result.unfitPieces.length > 0 && (
            <div className="cl-warn">
              ⚠ {result.unfitPieces.length} pièce(s) ne tiennent pas sur un panneau{" "}
              {num(activeMat.panelW)}×{num(activeMat.panelH)} mm
              {activeMat.grainDirection ? " (rotation bloquée — essaie de décocher « Bloquer la rotation »)" : ""}.
              Vérifie les cotes : {result.unfitPieces.map((u) => u.label || "—").join(", ")}.
            </div>
          )}

          {result.sheets.length > 0 && (
            <div className="cl-sheets">
              {result.sheets.map((s) => (
                <SheetSVG key={s.sheetIndex} layout={s} panelW={num(activeMat.panelW)} panelH={num(activeMat.panelH)} index={s.sheetIndex} />
              ))}
            </div>
          )}

          {/* liste de débit copiable */}
          <div className="card-eyebrow mt">Liste de débit — à copier pour le fournisseur</div>
          <p className="muted tip">
            {cutList.totalPieces} pièce(s) · {cutList.distinct} cote(s) différente(s). Colonnes séparées
            par des tabulations — colle directement dans un mail ou un tableur.
          </p>
          <textarea
            className="in in-area cl-list"
            readOnly
            rows={Math.min(12, cutList.distinct + 2)}
            value={cutList.text}
            onFocus={(e) => e.target.select()}
          />
          <div className="add-row cl-actions">
            <button className="btn ghost" onClick={copyList}>Copier la liste</button>
            <button className="btn" onClick={addActiveToDevis} disabled={metrics.totalSheets === 0}>
              Ajouter au devis ({metrics.totalSheets} panneau{metrics.totalSheets > 1 ? "x" : ""})
            </button>
          </div>
        </>
      )}

      {/* total tous matériaux — bouton « tout ajouter » quand plusieurs matières sont chiffrées */}
      {grand.lines > 1 && (
        <div className="cl-grand">
          <div className="cl-grand-sum">
            <span><strong>{grand.sheets}</strong> panneau(x) · <strong>{grand.lines}</strong> matières chiffrées</span>
            <span className="cl-grand-cost">{eur(grand.cost)}</span>
          </div>
          <button type="button" className="btn" onClick={addAllToDevis}>
            Ajouter tout au devis ({grand.lines} lignes)
          </button>
        </div>
      )}
    </div>
  );
}

.s-grand{border-top:2px solid var(--ink); margin-top:6px; padding-top:9px; font-family:var(--display); font-weight:800; font-size:15px; color:var(--ink)}
.s-acompte{background:var(--oak-soft); margin-top:8px; padding:8px 10px; border-radius:5px; font-weight:600; color:var(--oak-2)}

.s-coco{font-size:10.5px; color:#6a6258; font-style:italic; margin-top:18px; border-left:2px solid var(--oak); padding-left:9px}
.s-cond{font-size:10.5px; color:#7a7264; margin-top:18px; line-height:1.55; white-space:pre-wrap}
.s-sign{display:flex; justify-content:flex-end; margin-top:26px}
.s-sign-box{border:1px solid #d2ccbe; border-radius:5px; padding:14px 18px; width:300px; min-height:74px}
.s-sign-lab{font-size:10.5px; color:#8a8276}
.s-foot{margin-top:26px; padding-top:12px; border-top:1px solid #ece7dc; text-align:center; font-size:10px; color:#9a9284}

/* modal */
.overlay{position:fixed; inset:0; background:rgba(28,24,18,.55); display:flex; align-items:flex-start; justify-content:center; padding:40px 16px; z-index:50; overflow:auto}
.modal{background:var(--card); border-radius:12px; width:100%; max-width:520px; box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal-wide{max-width:780px}
.modal-head{display:flex; align-items:center; justify-content:space-between; padding:16px 20px; border-bottom:1px solid var(--line)}
.modal-head h2{font-family:var(--display); font-weight:700; font-size:16px; margin:0; letter-spacing:.02em}
.modal-body{padding:20px}
.modal-foot{margin-top:18px; display:flex; justify-content:flex-end}

.qlist{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:9px}
.qrow{display:flex; align-items:center; justify-content:space-between; gap:12px; border:1px solid var(--line); border-radius:9px; padding:11px 13px; background:#fff}
.qrow-num{font-family:var(--mono); font-weight:600; font-size:13.5px}
.qrow-meta{font-size:11.5px; color:var(--ink-3); margin-top:2px}
.qrow-act{display:flex; gap:7px}

/* calepinage */
.cl .grid{margin-bottom:4px}
.cl-tog{height:38px; border:1px solid var(--line); border-radius:7px; padding:0 10px; background:#fff}
.cl-pieces{display:flex; flex-direction:column; gap:7px; margin-bottom:4px}
.cl-prow{display:grid; grid-template-columns:1fr 96px 96px 70px 30px; gap:8px; align-items:center}
.cl-prow .in{padding:7px 9px; font-size:13px}
.cl-prow-head{font-size:10.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-3); font-weight:600; padding:0 2px}
.cl-prow-head span:nth-child(2),.cl-prow-head span:nth-child(3),.cl-prow-head span:nth-child(4){text-align:right; padding-right:9px}
.cl-swatch-wrap{display:flex; align-items:center; gap:8px; min-width:0}
.cl-swatch{flex:none; width:14px; height:14px; border-radius:3px; border:1px solid rgba(0,0,0,.18)}
.cl-stats{margin-top:2px}
.cl-warn{background:#f6e9e2; border:1px solid var(--brick); color:#7c2a1d; border-radius:8px; padding:10px 12px; font-size:12.5px; margin:6px 0 14px; line-height:1.5}
.cl-sheets{display:flex; flex-wrap:wrap; gap:14px; margin:4px 0 6px}
.cl-sheet{margin:0; flex:1 1 320px; min-width:280px; max-width:520px}
.cl-sheet-cap{font-family:var(--mono); font-size:11px; color:var(--ink-3); margin-bottom:5px}
.cl-svg{display:block; width:100%; height:auto; background:#fff; border:1px solid var(--line); border-radius:6px}
.cl-panel{fill:#faf7f0; stroke:var(--ink-3); stroke-width:0; }
.cl-piece-lab{fill:var(--ink); font-family:var(--mono); font-weight:600; paint-order:stroke; stroke:#fff; stroke-width:.6; stroke-linejoin:round}
.cl-list{font-family:var(--mono); font-size:12px; white-space:pre; overflow:auto; background:#fff}
.cl-actions{justify-content:flex-end; align-items:center}

/* onglets matériaux + total tous matériaux */
.cl-mats{display:flex; flex-wrap:wrap; gap:7px; margin-bottom:14px}
.cl-mat{display:inline-flex; align-items:center; gap:8px; padding:7px 11px; border:1px solid var(--line); border-radius:8px; background:#fff; cursor:pointer; font:inherit; font-size:13px; color:var(--ink-2)}
.cl-mat:hover{border-color:var(--ink-3)}
.cl-mat.active{border-color:var(--oak-2); background:var(--oak-soft); color:var(--ink); font-weight:600; box-shadow:inset 0 0 0 1px var(--oak-2)}
.cl-mat-name{max-width:200px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.cl-mat-badge{font-family:var(--mono); font-size:11px; color:var(--ink-3)}
.cl-mat.active .cl-mat-badge{color:var(--oak-2)}
.cl-mat-x{display:inline-flex; align-items:center; justify-content:center; width:18px; height:18px; color:var(--ink-3); font-size:11px; border-radius:5px}
.cl-mat-x:hover{background:var(--brick); color:#fff}
.cl-mat-add{padding:7px 11px}
.cl-grand{display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap; margin-top:18px; padding:13px 15px; border:1px solid var(--oak-2); border-radius:9px; background:var(--oak-soft)}
.cl-grand-sum{display:flex; flex-direction:column; gap:2px; font-size:13px; color:var(--ink-2)}
.cl-grand-cost{font-family:var(--mono); font-size:16px; font-weight:700; color:var(--oak-2)}

.toast{position:fixed; bottom:22px; left:50%; transform:translateX(-50%); background:var(--ink); color:#fff; padding:11px 20px; border-radius:8px; font-size:13px; font-weight:500; z-index:60; box-shadow:0 8px 24px rgba(0,0,0,.3)}

/* responsive */
@media (max-width:760px){
  .grid{grid-template-columns:repeat(2,1fr)}
  .line-body{grid-template-columns:repeat(2,1fr)}
  .sum-grid{grid-template-columns:repeat(2,1fr)}
  .bar{gap:10px}
  .brand-sub{display:none}
  .sheet{padding:26px 20px}
  .s-head{flex-direction:column}
  .s-meta{text-align:left}
  .s-metatab{margin-left:0}
  .s-parties{grid-template-columns:1fr}
  .s-totals{width:100%}
  .cl-prow{grid-template-columns:1fr 64px 64px 50px 28px; gap:6px}
  .cl-sheet{max-width:none}
}

/* print */
@media print{
  @page{margin:14mm}
  body *{visibility:hidden}
  .sheet, .sheet *{visibility:visible}
  .sheet{position:absolute; left:0; top:0; width:100%; box-shadow:none; border:0; border-radius:0; padding:0}
  .no-print{display:none !important}
}
`;

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
