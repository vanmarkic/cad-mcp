const EMPTY_CLIENT = { nom: "", adresse: "", email: "", tel: "", clientType: "particulier" };
function ClientForm({ initial, onSave, onCancel }) {
  const [c, setC] = useState({ ...EMPTY_CLIENT, ...initial });
  const f = (k) => (v) => setC((x) => ({ ...x, [k]: v }));

      <div className="grid">
        <Field label="Nom / société" wide><TextIn value={c.nom} onChange={f("nom")} /></Field>
        <Field label="Adresse" wide><TextIn value={c.adresse} onChange={f("adresse")} /></Field>
        <Field label="Téléphone"><TextIn value={c.tel} onChange={f("tel")} /></Field>

// Intitulé court des travaux (texte libre éventuellement formaté → texte brut, 60 car.)
function chantierTitle(q) {
  const t = String((q && q.chantier) || "").replace(/[*_~`#>]/g, "").replace(/\s+/g, " ").trim();
  return t.length > 60 ? t.slice(0, 59) + "…" : t;
}

  const [editing, setEditing] = useState(null); // id, ou "new"

    <div>
      <p className="muted reglages-backup-note">

                        <button className="linkish" onClick={() => setOpen(open === c.id ? null : c.id)} aria-expanded={open === c.id}>
                          {qs.length} devis {open === c.id ? "▴" : "▾"}

/* ---------- installation de l'application (PWA) : explication selon l'appareil ---------- */
function isStandalone() {
  try { return window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true; } catch (e) { return false; }
}
function isIOS() {
  const ua = navigator.userAgent || "";
  return /iPhone|iPad|iPod/.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
}
function isAndroid() {
  return /Android/i.test(navigator.userAgent || "");
}
function InstallHelp({ installable, onInstall, serverMode }) {
  if (isStandalone()) {
    return <p className="muted reglages-backup-note install-state">✓ ÉTABLI est installée sur cet appareil et s'ouvre comme une application.</p>;
  }
  const ios = isIOS();
  const android = !ios && isAndroid();
  return (
    <div className="install-help">
      <p className="muted reglages-backup-note">
        Installée, ÉTABLI a son icône sur l'écran d'accueil, s'ouvre en plein écran comme une application et
        démarre même sans réseau. Rien à télécharger depuis un magasin d'applications.
      </p>
      {installable ? (
        <div className="reglages-backup-act"><button className="btn" onClick={onInstall}>Installer ÉTABLI</button></div>
      ) : ios ? (
        <ol className="install-steps">
          <li>Ouvrez cette page dans <strong>Safari</strong>.</li>
          <li>Touchez <strong>Partager</strong> (le carré avec une flèche vers le haut).</li>
          <li>Choisissez <strong>« Sur l'écran d'accueil »</strong>, puis « Ajouter ».</li>
        </ol>
      ) : android ? (
        <ol className="install-steps">
          <li><strong>Chrome</strong> : menu <strong>⋮</strong> (en haut à droite) → <strong>« Installer l'application »</strong> (ou « Ajouter à l'écran d'accueil » → « Installer »).</li>
          <li><strong>Samsung Internet</strong> : menu <strong>≡</strong> (en bas) → « Ajouter la page à » → « Écran d'accueil ».</li>
          <li><strong>Firefox</strong> : menu <strong>⋮</strong> → « Installer » / « Ajouter à l'écran d'accueil ».</li>
          <li>L'icône ÉTABLI apparaît avec vos autres applications.</li>
        </ol>
      ) : (
        <ol className="install-steps">
          <li>Ouvrez le <strong>menu du navigateur</strong> (⋮ ou ⋯).</li>
          <li>Choisissez <strong>« Installer l'application »</strong> ou <strong>« Ajouter à l'écran d'accueil »</strong>.</li>
        </ol>
      )}
      {serverMode ? (
        <p className="muted reglages-backup-note">Vos devis restent sur votre compte : l'application installée les retrouve dès la connexion.</p>
      ) : (
        <p className="muted reglages-backup-note">
          {ios ? null : <strong>Vos devis restent dans ce navigateur.</strong>}{ios ? " Attention sur iPhone et iPad : l'application installée démarre VIDE (stockage séparé de Safari). Avant d'installer, faites Réglages → « Sauvegarder (télécharger) » ici dans Safari, puis Réglages → « Restaurer… » dans l'application installée." : android ? " Sur Android, l'application installée retrouve les devis déjà faits dans ce navigateur (même stockage). Installez-la depuis le navigateur où sont vos devis." : ""}
        </p>
      )}
      <p className="muted reglages-backup-note">Hors connexion, l'application s'ouvre ; {serverMode ? "l'enregistrement attend le retour du réseau." : "tout fonctionne."}</p>

// Changement de mot de passe (mode serveur) : ancien + nouveau + confirmation ; les autres appareils sont
// déconnectés, celui-ci reste connecté.
function PasswordForm({ account, onChange }) {
  const [cur, setCur] = useState("");
  const [nxt, setNxt] = useState("");
  const [conf, setConf] = useState("");
  const [msg, setMsg] = useState(null); // { ok, text }
  const [busy, setBusy] = useState(false);
  const tooShort = nxt.length > 0 && nxt.length < 10;
  const mismatch = conf.length > 0 && conf !== nxt;
  const submit = async (e) => {
    e.preventDefault();
    if (nxt.length < 10 || nxt !== conf) return;
    setBusy(true); setMsg(null);
    const r = await onChange(cur, nxt);
    setBusy(false);
    if (r.ok) {
      setCur(""); setNxt(""); setConf("");
      setMsg({ ok: true, text: "Mot de passe changé. Vos autres appareils devront se reconnecter." });
    } else {
      setCur("");
      setMsg({ ok: false, text: r.kind === "locked" ? `${r.message} Réessayez dans ${Math.max(1, Math.ceil((r.retryAfter || 60) / 60))} min.` : r.message });
    }
  };
  return (
    <form className="pwform" onSubmit={submit}>
      <div className="card-eyebrow mt">Mon compte{account ? ` — ${account}` : ""}</div>
      {/* champ caché : aide les gestionnaires de mots de passe à associer l'identifiant */}
      <input type="text" name="username" autoComplete="username" value={account || ""} readOnly hidden />
      <div className="grid">
        <Field label="Mot de passe actuel">
          <input className="in" type="password" name="current-password" autoComplete="current-password" value={cur} onChange={(e) => setCur(e.target.value)} />
        </Field>
        <Field label="Nouveau mot de passe" hint={tooShort ? "10 caractères minimum" : "10 caractères minimum ; une phrase de passe est idéale"}>
          <input className="in" type="password" name="new-password" autoComplete="new-password" value={nxt} onChange={(e) => setNxt(e.target.value)} />
        </Field>
        <Field label="Confirmer" hint={mismatch ? "ne correspond pas" : undefined}>
          <input className="in" type="password" name="confirm-password" autoComplete="new-password" value={conf} onChange={(e) => setConf(e.target.value)} />
        </Field>
      </div>
      {msg ? <p className={"pw-msg " + (msg.ok ? "pw-ok" : "pw-err")} role="status">{msg.text}</p> : null}
      <div className="reglages-backup-act">
        <button className="btn" type="submit" disabled={busy || !cur || nxt.length < 10 || nxt !== conf}>
          {busy ? "Changement…" : "Changer le mot de passe"}
        </button>
      </div>
    </form>
  );
}

/* =========================================================================
   MODAL shell
   ========================================================================= */
function Modal({ title, children, onClose, wide }) {
  // Échap ferme la modale (en plus du clic hors-cadre et du bouton ✕).
  useEffect(() => {
    const onKey = (e) => { if (e.key === "Escape") onClose(); };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, [onClose]);
  return (
    <div className="overlay no-print" onClick={onClose}>
      <div
        className={"modal" + (wide ? " modal-wide" : "")}
        onClick={(e) => e.stopPropagation()}
      >
        <div className="modal-head">
          <h2>{title}</h2>
          <button className="ico" onClick={onClose}>
            ✕
          </button>
        </div>
        <div className="modal-body">{children}</div>
      </div>
    </div>
  );
}

/* =========================================================================
   CALEPINAGE — débit de panneaux (cutlist)
   ========================================================================= */
function SheetSVG({ layout, panelW, panelH, index }) {
  // viewBox en mm ; le CSS gère la taille affichée.
  const fs = Math.max(panelW, panelH) / 40; // taille de texte (unités mm)
  const sw = Math.max(panelW, panelH) / 350; // épaisseur de trait (unités mm)
  const nf1 = (n) => (isFinite(n) ? n : 0).toLocaleString("fr-BE", { maximumFractionDigits: 1 });
  return (
    <figure className="cl-sheet">
      <figcaption className="cl-sheet-cap">
        Panneau {index + 1} · chute {nf1(layout.wastePercent)} %
      </figcaption>
      <svg className="cl-svg" viewBox={`0 0 ${panelW} ${panelH}`} preserveAspectRatio="xMidYMid meet">
        <rect x={0} y={0} width={panelW} height={panelH} className="cl-panel" />
        {layout.pieces.map((p, i) => (
          <g key={i}>
            <rect
              x={p.x} y={p.y} width={p.width} height={p.height}
              fill={p.color} fillOpacity={0.5} stroke={p.color} strokeWidth={sw}
            />
            <text
              x={p.x + p.width / 2} y={p.y + p.height / 2}
              fontSize={fs} textAnchor="middle" dominantBaseline="central"
              className="cl-piece-lab"
            >
              <tspan x={p.x + p.width / 2} dy={-fs * 0.15}>{p.label || "—"}</tspan>
              <tspan x={p.x + p.width / 2} dy={fs * 1.1}>
                {Math.round(p.width)}×{Math.round(p.height)}{p.rotated ? " ↻" : ""}
              </tspan>
            </text>
          </g>
        ))}
      </svg>
    </figure>
  );
}

// Schéma d'une barre débitée en long : un bandeau, les pièces posées bout à bout
// (le trait de scie apparaît comme un petit vide), le reste = chute.
function BarSVG({ layout, barLength, index }) {
  const h = barLength / 14; // hauteur du bandeau (unités mm du viewBox)
  const fs = h * 0.36;
  const sw = barLength / 700;
  return (
    <figure className="cl-bar">
      <figcaption className="cl-sheet-cap">
        Barre {index + 1} · {layout.pieces.length} pièce(s) · chute {nf1(layout.wastePercent)} %
        {" "}({Math.round(layout.wasteLength)} mm)
      </figcaption>
      <svg className="cl-svg cl-svg-bar" viewBox={`0 0 ${barLength} ${h}`} preserveAspectRatio="xMidYMid meet">
        <rect x={0} y={0} width={barLength} height={h} className="cl-panel" />
        {layout.pieces.map((p, i) => (
          <g key={i}>
            <title>{(p.label || "Pièce") + " — " + Math.round(p.length) + " mm"}</title>
            <rect x={p.x} y={0} width={p.length} height={h} fill={p.color} fillOpacity={0.5} stroke={p.color} strokeWidth={sw} />
            {p.length * 1 > fs * 2.4 ? (
              <text x={p.x + p.length / 2} y={h / 2} fontSize={fs} textAnchor="middle" dominantBaseline="central" className="cl-piece-lab">
                {Math.round(p.length)}
              </text>
            ) : null}
          </g>
        ))}
      </svg>
    </figure>
  );
}

function Calepinage({ calep, setCalep, params, onAddToDevis, flash }) {
  // Liste des matériaux + matériau actif (avec garde si l'état est incomplet).
  const materials = calep.materials && calep.materials.length ? calep.materials : [newMaterial(0)];
  const activeId = materials.some((m) => m.id === calep.activeId) ? calep.activeId : materials[0].id;
  const activeMat = materials.find((m) => m.id === activeId) || materials[0];

  // Mutations ciblant le matériau actif.
  const setMat = (patch) =>
    setCalep((c) => ({ ...c, materials: c.materials.map((m) => (m.id === activeId ? { ...m, ...patch } : m)) }));
  const setPiece = (id, patch) =>
    setCalep((c) => ({
      ...c,
      materials: c.materials.map((m) =>
        m.id === activeId ? { ...m, pieces: m.pieces.map((p) => (p.id === id ? { ...p, ...patch } : p)) } : m
      ),
    }));
  const addPiece = () =>
    setCalep((c) => ({
      ...c,
      materials: c.materials.map((m) =>
        m.id === activeId ? { ...m, pieces: [...m.pieces, newPiece(m.pieces.length)] } : m
      ),
    }));
  const delPiece = (id) =>
    setCalep((c) => ({
      ...c,
      materials: c.materials.map((m) =>
        m.id === activeId ? { ...m, pieces: m.pieces.filter((p) => p.id !== id) } : m
      ),
    }));

  // Gestion des matériaux (onglets).
  const selectMat = (id) => setCalep((c) => ({ ...c, activeId: id }));
  const addMaterial = (kind = "panel") =>
    setCalep((c) => {
      const m = newMaterial(c.materials.length, kind);
      return { ...c, materials: [...c.materials, m], activeId: m.id };
    });
  const delMaterial = (id) =>
    setCalep((c) => {
      if (c.materials.length <= 1) return c; // on garde toujours au moins un matériau
      const left = c.materials.filter((m) => m.id !== id);
      return { ...c, materials: left, activeId: c.activeId === id ? left[0].id : c.activeId };
    });

  // Calcul de TOUS les matériaux (pour les badges d'onglet + le total général),
  // puis on isole le matériau actif pour l'éditeur ci-dessous.
  const computed = useMemo(() => materials.map(computeMaterial), [materials]);
  const compById = (id) => computed.find((c) => c.id === id) || computeMaterial(activeMat);
  const active = compById(activeId);
  const { result, metrics, cutList, hasPieces } = active;
  const isLinear = active.kind === "linear";

  // Total tous matériaux confondus (uniquement ceux qui consomment ≥ 1 panneau / barre).
  const grand = useMemo(() => {
    let sheets = 0, bars = 0, cost = 0, lines = 0;
    computed.forEach((c) => {
      if (c.units > 0) {
        if (c.kind === "linear") bars += c.units; else sheets += c.units;
        cost += c.metrics.totalCost;
        lines += 1;
      }
    });
    return { sheets, bars, cost, lines };
  }, [computed]);

  const copyList = async () => {
    try {
      await navigator.clipboard.writeText(cutList.text);
      flash("Liste de débit copiée");
    } catch (e) {
      flash("Sélectionne le texte puis Ctrl+C");
    }
  };

  const addActiveToDevis = () => {
    if (active.units === 0) return;
    onAddToDevis(buildCalepLine(activeMat, active, params.marge));
  };
  const addAllToDevis = () => {
    const lines = [];
    materials.forEach((m) => {
      const c = compById(m.id);
      if (c.units > 0) lines.push(buildCalepLine(m, c, params.marge));
    });
    if (lines.length) onAddToDevis(lines);
  };

  return (
    <div className="cl">
      <p className="muted tip">
        Les panneaux et les barres s'achètent entiers. Ajoute un matériau par type
        (ex. MDF 18 mm à 30 €/m², aglo blanc 8 mm à 15 €/m²) : chacun se débite sur
        ses propres plaques et crée sa propre ligne de devis. Pour les baguettes,
        plinthes et profilés, ajoute un matériau « barre » : tu indiques la longueur
        de la barre et son prix (au mètre linéaire ou à la barre), puis les longueurs à couper.
      </p>

      {/* onglets matériaux */}
      <div className="cl-mats">
        {materials.map((m, i) => {
          const c = compById(m.id);
          return (
            <button
              key={m.id}
              type="button"
              className={"cl-mat" + (m.id === activeId ? " active" : "")}
              onClick={() => selectMat(m.id)}
            >
              <span className="cl-mat-name">{m.material || `Matière ${i + 1}`}</span>
              <span className="cl-mat-badge">
                {c.units > 0 ? `${c.units} ${c.kind === "linear" ? "barre" + (c.units > 1 ? "s" : "") : "pann."}` : "—"}
              </span>
              {materials.length > 1 && (
                <span
                  className="cl-mat-x"
                  title="Supprimer ce matériau"
                  role="button"
                  onClick={(e) => { e.stopPropagation(); delMaterial(m.id); }}
                >✕</span>
              )}
            </button>
          );
        })}
        <button type="button" className="btn add cl-mat-add" onClick={() => addMaterial("panel")}>+ Matière</button>
        <button
          type="button"
          className="btn add cl-lin-add"
          title="Baguette, plinthe, profilé… débité en long dans des barres"
          onClick={() => addMaterial("linear")}
        >
          + Barre / profilé
        </button>
      </div>

      {/* stock + matière (matériau actif) */}
      <div className="card-eyebrow">{isLinear ? "Barre & matière" : "Panneau & matière"}</div>
      {isLinear ? (
        <div className="grid">
          <Field label="Matière / désignation" wide>
            <TextIn value={activeMat.material} onChange={(v) => setMat({ material: v })} placeholder="Ex. baguette chêne 20×20, profilé alu U…" />
          </Field>
          <Field label="Longueur de la barre" hint="longueur de stock vendue">
            <NumIn value={activeMat.barLen} onChange={(v) => setMat({ barLen: v })} suffix="mm" />
          </Field>
          <Field label="Prix matière" hint="HTVA">
            <div className="remise">
              <NumIn value={activeMat.linPrice} onChange={(v) => setMat({ linPrice: v })} />
              <select
                className="in in-sel cl-pu"
                aria-label="Unité du prix"
                value={activeMat.linPriceUnit}
                onChange={(e) => setMat({ linPriceUnit: e.target.value })}
              >
                <option value="ml">€ / ml</option>
                <option value="bar">€ / barre</option>
              </select>
            </div>
          </Field>
          <Field label="Trait de scie">
            <NumIn value={activeMat.kerf} onChange={(v) => setMat({ kerf: v })} suffix="mm" />
          </Field>
          <Field label="Facturation" hint="comment le fournisseur compte" wide>
            <select
              className="in in-sel"
              value={activeMat.linBilling}
              onChange={(e) => setMat({ linBilling: e.target.value })}
            >
              <option value="bar">Barres entières (on achète la barre complète)</option>
              <option value="ml">Mètres débités (coupe à la demande, on ne paie que le ml utilisé)</option>
            </select>
          </Field>
        </div>
      ) : (
        <div className="grid">
          <Field label="Matière / désignation" wide>
            <TextIn value={activeMat.material} onChange={(v) => setMat({ material: v })} placeholder="Ex. MDF 18 mm, aglo blanc 8 mm…" />
          </Field>
          <Field label="Longueur panneau">
            <NumIn value={activeMat.panelW} onChange={(v) => setMat({ panelW: v })} suffix="mm" />
          </Field>
          <Field label="Largeur panneau">
            <NumIn value={activeMat.panelH} onChange={(v) => setMat({ panelH: v })} suffix="mm" />
          </Field>
          <Field label="Prix matière" hint="HTVA, au m²">
            <NumIn value={activeMat.pricePerM2} onChange={(v) => setMat({ pricePerM2: v })} suffix="€/m²" />
          </Field>
          <Field label="Trait de scie">
            <NumIn value={activeMat.kerf} onChange={(v) => setMat({ kerf: v })} suffix="mm" />
          </Field>
          <Field label="Sens du fil">
            <label className="tog cl-tog">
              <input
                type="checkbox"
                checked={!!activeMat.grainDirection}
                onChange={(e) => setMat({ grainDirection: e.target.checked })}
              />
              Bloquer la rotation
            </label>
          </Field>
        </div>
      )}

      {/* pièces (matériau actif) */}
      <div className="card-eyebrow mt">Pièces à débiter</div>
      {activeMat.pieces.length === 0 && (
        <div className="empty">Aucune pièce. Ajoute les pièces à découper ci-dessous.</div>
      )}
      {activeMat.pieces.length > 0 && (
        <div className="cl-pieces">
          <div className={"cl-prow cl-prow-head" + (isLinear ? " cl-prow-lin" : "")}>
            <span>Désignation</span><span>Long.{isLinear ? " (mm)" : ""}</span>
            {!isLinear && <span>Larg.</span>}<span>Qté</span><span></span>
          </div>
          {activeMat.pieces.map((p) => (
            <div className={"cl-prow" + (isLinear ? " cl-prow-lin" : "")} key={p.id}>
              <span className="cl-swatch-wrap">
                <span className="cl-swatch" style={{ background: p.color }} />
                <input className="in" type="text" value={p.label}
                  placeholder={isLinear ? "Ex. plinthe salon, montant…" : "Ex. côté, étagère…"}
                  onChange={(e) => setPiece(p.id, { label: e.target.value })} />
              </span>
              <input className="in in-mono in-num" inputMode="decimal" value={p.w} placeholder="0"
                onChange={(e) => setPiece(p.id, { w: e.target.value })} />
              {!isLinear && (
                <input className="in in-mono in-num" inputMode="decimal" value={p.h} placeholder="0"
                  onChange={(e) => setPiece(p.id, { h: e.target.value })} />
              )}
              <input className="in in-mono in-num" inputMode="decimal" value={p.qty} placeholder="1"
                onChange={(e) => setPiece(p.id, { qty: e.target.value })} />
              <button className="ico ico-del" title="Supprimer" onClick={() => delPiece(p.id)}>✕</button>
            </div>
          ))}
        </div>
      )}
      <div className="add-row">
        <button className="btn add" onClick={addPiece}>+ Ajouter une pièce</button>
      </div>

      {/* résultats (matériau actif) */}
      {hasPieces && result && (
        <>
          <div className="card-eyebrow mt">Résultat — {activeMat.material || `Matière ${materials.indexOf(activeMat) + 1}`}</div>
          {isLinear ? (
            <>
              <div className="sum-grid cl-stats">
                <Stat label="Barres à acheter" value={String(metrics.totalBars)} big />
                <Stat label="Chute" value={nf1(metrics.totalWastePercent) + " %"} />
                <Stat
                  label={metrics.billing === "ml" ? "Mètres facturés" : "Mètres achetés"}
                  value={nf2(metrics.billedM) + " ml"}
                  sub={metrics.billing === "ml" ? undefined : `dont ${nf2(metrics.usedM)} ml utilisés`}
                  muted
                />
                <Stat label="Coût matière total" value={eur(metrics.totalCost)} color="var(--oak-2)" />
              </div>
              <p className="muted tip cl-pu-note">
                {eur(metrics.pricePerMl)} / ml · {eur(metrics.pricePerBar)} / barre de {num(activeMat.barLen)} mm
              </p>

              {result.unfitPieces.length > 0 && (
                <div className="cl-warn">
                  ⚠ {result.unfitPieces.length} pièce(s) plus longues qu'une barre de {num(activeMat.barLen)} mm
                  — impossible de les débiter d'un seul tenant. Vérifie les cotes :{" "}
                  {result.unfitPieces.map((u) => u.label || "—").join(", ")}.
                </div>
              )}

              {result.bars.length > 0 && (
                <div className="cl-bars">
                  {result.bars.map((b) => (
                    <BarSVG key={b.barIndex} layout={b} barLength={num(activeMat.barLen)} index={b.barIndex} />
                  ))}
                </div>
              )}
            </>
          ) : (
            <>
              <div className="sum-grid cl-stats">
                <Stat label="Panneaux à acheter" value={String(metrics.totalSheets)} big />
                <Stat label="Chute" value={nf1(metrics.totalWastePercent) + " %"} />
                <Stat label="Coût / panneau" value={eur(metrics.costPerPanel)} muted />
                <Stat label="Coût matière total" value={eur(metrics.totalCost)} color="var(--oak-2)" />
              </div>

              {result.unfitPieces.length > 0 && (
                <div className="cl-warn">
                  ⚠ {result.unfitPieces.length} pièce(s) ne tiennent pas sur un panneau{" "}
                  {num(activeMat.panelW)}×{num(activeMat.panelH)} mm
                  {activeMat.grainDirection ? " (rotation bloquée — essaie de décocher « Bloquer la rotation »)" : ""}.
                  Vérifie les cotes : {result.unfitPieces.map((u) => u.label || "—").join(", ")}.
                </div>
              )}

              {result.sheets.length > 0 && (
                <div className="cl-sheets">
                  {result.sheets.map((s) => (
                    <SheetSVG key={s.sheetIndex} layout={s} panelW={num(activeMat.panelW)} panelH={num(activeMat.panelH)} index={s.sheetIndex} />
                  ))}
                </div>
              )}
            </>
          )}

          {/* liste de débit copiable */}
          <div className="card-eyebrow mt">Liste de débit — à copier pour le fournisseur</div>
          <p className="muted tip">
            {cutList.totalPieces} pièce(s) · {cutList.distinct} cote(s) différente(s)
            {isLinear ? ` · ${nf2(cutList.totalLength / 1000)} ml à débiter` : ""}. Colonnes séparées
            par des tabulations — colle directement dans un mail ou un tableur.
          </p>
          <textarea
            className="in in-area cl-list"
            readOnly
            rows={Math.min(12, cutList.distinct + 2)}
            value={cutList.text}
            onFocus={(e) => e.target.select()}
          />
          <div className="add-row cl-actions">
            <button className="btn ghost" onClick={copyList}>Copier la liste</button>
            <button className="btn" onClick={addActiveToDevis} disabled={active.units === 0}>
              {isLinear
                ? `Ajouter au devis (${metrics.totalBars} barre${metrics.totalBars > 1 ? "s" : ""}${metrics.billing === "ml" ? ` · ${nf2(metrics.usedM)} ml` : ""})`
                : `Ajouter au devis (${metrics.totalSheets} panneau${metrics.totalSheets > 1 ? "x" : ""})`}
            </button>
          </div>
        </>
      )}

      {/* total tous matériaux — bouton « tout ajouter » quand plusieurs matières sont chiffrées */}
      {grand.lines > 1 && (
        <div className="cl-grand">
          <div className="cl-grand-sum">
            <span>
              {grand.sheets > 0 && <><strong>{grand.sheets}</strong> panneau(x) · </>}
              {grand.bars > 0 && <><strong>{grand.bars}</strong> barre(s) · </>}
              <strong>{grand.lines}</strong> matières chiffrées
            </span>
            <span className="cl-grand-cost">{eur(grand.cost)}</span>
          </div>
          <button type="button" className="btn" onClick={addAllToDevis}>
            Ajouter tout au devis ({grand.lines} lignes)
          </button>
        </div>
      )}
    </div>
  );
}

   CSS
   ========================================================================= */
const CSS = `
@import url('https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap');

:root{

  --line:#D7CFBF; --line-2:#EAE4D7;
  --oak:#A8631F; --oak-2:#8A5018; --oak-soft:#F0E2CE;
  --green:#3D6B4A; --amber:#C08A2E; --brick:#A23D2C;

  --body:'Inter',system-ui,sans-serif;

}

/* top bar */

  background:#2c271f; padding:4px 8px; border-radius:3px; line-height:1;
}
.brand-name{font-family:var(--display);font-weight:800;letter-spacing:.22em;font-size:17px}
.brand-sub{font-size:11px;color:#b3a892;letter-spacing:.04em;margin-top:1px}

.flip{display:flex; background:#2c271f; border-radius:7px; padding:3px; gap:2px}

.bar-actions{display:flex; gap:7px; flex-wrap:wrap}
.btn{

.btn.ghost{background:transparent; color:#e8e0d0; border:1px solid #4a4338}

.btn.add{background:var(--oak-soft); color:var(--oak-2); border:1px dashed var(--oak)}

/* layout */
.wrap{max-width:1020px; margin:0 auto; padding:22px 18px 80px; display:flex; flex-direction:column; gap:18px}
.card{
  background:var(--card); border:1px solid var(--line);
  border-radius:11px; padding:18px 18px 20px;
  box-shadow:0 1px 2px rgba(40,30,15,.05);
}
.card-eyebrow{
  font-family:var(--display); font-weight:700; font-size:11px; letter-spacing:.18em;

  display:flex; align-items:center; gap:8px;
}
.card-eyebrow::after{content:""; flex:1; height:1px; background:var(--line)}
.tip{margin:-6px 0 14px; font-size:12.5px; line-height:1.55}

.grid{display:grid; grid-template-columns:repeat(3,1fr); gap:13px 14px}

.numwrap{position:relative; display:block}

/* lines */

.lines{display:flex; flex-direction:column; gap:12px}

  text-transform:uppercase; padding:4px 8px; border-radius:5px; white-space:nowrap;
}
.chip-fourniture{background:#e8dcc6; color:#7a5a1c}
.chip-main{background:#d9e3da; color:#39593f}
.chip-forfait{background:#e2dae6; color:#5b4769}
.line-title-wrap{flex:1; position:relative}
.line-title{width:100%; border-color:transparent; background:transparent; font-weight:600; font-size:14px}
.line-title:focus{background:#fff}
/* auto-complétion catalogue */
.ac{
  list-style:none; margin:4px 0 0; padding:4px; position:absolute; z-index:30;
  left:0; right:0; top:100%; background:#fff; border:1px solid var(--line);

  display:flex; flex-direction:column; align-items:flex-start; gap:1px; width:100%;

.ac-item:hover{background:var(--oak-soft)}
.ac-desig{font-weight:600; font-size:13px; color:var(--ink)}
.ac-meta{font-size:11px; color:var(--ink-3)}
.line-ord{display:flex; gap:4px}
.ico-cat{color:var(--oak-2)}
.ico-cat:hover{border-color:var(--oak); color:var(--oak); background:var(--oak-soft)}
.add-cat{margin-left:auto}
.cat-list .qrow-num{font-weight:600}

.line-body{display:grid; grid-template-columns:repeat(4,1fr); gap:11px; padding:13px 12px 4px}
.line-detail{padding:4px 12px 0}
.line-foot{display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap; padding:10px 12px 12px}
.toggles{display:flex; gap:16px; flex-wrap:wrap}
.tog{display:flex; align-items:center; gap:6px; font-size:11.5px; color:var(--ink-2); cursor:pointer}
.tog input{accent-color:var(--oak); width:14px; height:14px}
.line-figs{display:flex; gap:16px; flex-wrap:wrap; font-size:11.5px; color:var(--ink-3)}
.fig b{color:var(--ink); margin-left:3px; font-size:12.5px}
.fig-sell b{color:var(--oak-2)}

.add-row{display:flex; gap:9px; flex-wrap:wrap; margin-top:14px}

/* adjustments */
.remise{display:flex; gap:7px}
.remise .in-sel{width:64px; flex:none}

/* summary */
.summary{background:linear-gradient(180deg,#fffdf8,#f7f2e8); border-color:var(--oak-soft)}
.sum-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:16px}
.stat{background:#fff; border:1px solid var(--line); border-radius:9px; padding:12px 13px}
.stat-big{border-color:var(--oak)}
.stat-lab{font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-3); font-weight:600}
.stat-val{font-family:var(--mono); font-weight:600; font-size:19px; margin-top:5px; font-variant-numeric:tabular-nums}
.stat-big .stat-val{font-size:23px}
.stat-sub{font-family:var(--mono); font-size:12px; margin-top:2px; font-weight:600}

.margebar{position:relative; height:26px; background:#efe7d7; border-radius:6px; overflow:hidden; margin-bottom:16px}
.margebar-fill{position:absolute; left:0; top:0; bottom:0; transition:width .35s ease, background .2s; opacity:.9}
.margebar-lab{position:absolute; left:11px; top:50%; transform:translateY(-50%); font-size:11px; font-weight:600; color:var(--ink); font-family:var(--mono)}

.sum-tot{border-top:1px solid var(--line); padding-top:12px}
.trow{display:flex; justify-content:space-between; padding:5px 0; font-size:13.5px; color:var(--ink-2)}
.trow-strong{font-weight:700; color:var(--ink); border-top:1px solid var(--line); margin-top:4px; padding-top:9px; font-size:15px}

/* client sheet */
.sheet-stage{max-width:880px; margin:0 auto; padding:22px 16px 80px}
.sheet-actions{display:flex; align-items:center; justify-content:space-between; gap:14px; margin-bottom:16px; flex-wrap:wrap}
.sheet{
  background:var(--sheet); color:#1a1a1a; border:1px solid #e3ddd0;
  border-radius:6px; box-shadow:0 8px 30px rgba(40,30,15,.13);
  padding:42px 44px; font-size:13px; line-height:1.55;
}
.s-head{display:flex; justify-content:space-between; gap:24px; align-items:flex-start; border-bottom:2px solid var(--ink); padding-bottom:18px}
.s-logo{font-family:var(--display); font-weight:800; font-size:21px; letter-spacing:.01em; color:var(--ink)}
.s-sub{font-size:12px; color:#6a6258; margin-top:2px}
.s-firm{display:flex; flex-direction:column; gap:1px; margin-top:10px; font-size:11px; color:#6a6258}
.s-meta{text-align:right; min-width:190px}
.s-title{font-family:var(--display); font-weight:800; font-size:26px; letter-spacing:.18em; color:var(--oak)}
.s-metatab{margin-left:auto; margin-top:8px; border-collapse:collapse; font-size:12px}
.s-metatab td{padding:2px 0 2px 14px; text-align:right; color:#444}
.s-metatab td:first-child{color:#8a8276; text-align:left; padding-left:0}

.s-parties{display:grid; grid-template-columns:1fr 1fr; gap:18px; margin:20px 0}
.s-block-lab{font-family:var(--display); font-size:10px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:var(--oak-2); margin-bottom:5px}
.s-block-body{font-size:12.5px; color:#2a2a2a}
.s-block-body strong{font-size:13.5px}

.s-table{width:100%; border-collapse:collapse; margin-top:8px}
.s-table th{
  font-family:var(--display); font-size:10.5px; font-weight:700; letter-spacing:.07em;
  text-transform:uppercase; color:#fff; background:var(--ink); padding:8px 10px; text-align:left;
}
.s-table th.c-qte, .s-table th.c-pu, .s-table th.c-tot{text-align:right}
.s-table td{padding:9px 10px; border-bottom:1px solid #ece7dc; vertical-align:top}
.c-qte,.c-pu,.c-tot{text-align:right; white-space:nowrap}
.c-desc{width:54%}
.s-desig{font-weight:600; color:#1a1a1a}
.s-detail{font-size:11px; color:#7a7264; margin-top:3px; white-space:pre-wrap}
.s-empty{text-align:center; color:#9a9284; padding:18px}

.s-totals{margin-left:auto; width:300px; margin-top:16px}
.s-tot-line{display:flex; justify-content:space-between; padding:5px 0; font-size:12.5px; color:#3a3a3a}
.s-grand{border-top:2px solid var(--ink); margin-top:6px; padding-top:9px; font-family:var(--display); font-weight:800; font-size:15px; color:var(--ink)}
.s-acompte{background:var(--oak-soft); margin-top:8px; padding:8px 10px; border-radius:5px; font-weight:600; color:var(--oak-2)}

.s-coco{font-size:10.5px; color:#6a6258; font-style:italic; margin-top:18px; border-left:2px solid var(--oak); padding-left:9px}
.s-cond{font-size:10.5px; color:#7a7264; margin-top:18px; line-height:1.55; white-space:pre-wrap}
.s-sign{display:flex; justify-content:flex-end; margin-top:26px}
.s-sign-box{border:1px solid #d2ccbe; border-radius:5px; padding:14px 18px; width:300px; min-height:74px}
.s-sign-lab{font-size:10.5px; color:#8a8276}
.s-foot{margin-top:26px; padding-top:12px; border-top:1px solid #ece7dc; text-align:center; font-size:10px; color:#9a9284}

/* modal */
.overlay{position:fixed; inset:0; background:rgba(28,24,18,.55); display:flex; align-items:flex-start; justify-content:center; padding:40px 16px; z-index:50; overflow:auto}
.modal{background:var(--card); border-radius:12px; width:100%; max-width:520px; box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal-wide{max-width:780px}
.modal-head{display:flex; align-items:center; justify-content:space-between; padding:16px 20px; border-bottom:1px solid var(--line)}
.modal-head h2{font-family:var(--display); font-weight:700; font-size:16px; margin:0; letter-spacing:.02em}
.modal-body{padding:20px}
.modal-foot{margin-top:18px; display:flex; justify-content:flex-end}

.reglages-backup-note{margin:0 0 12px; max-width:60ch; line-height:1.5}
.reglages-backup-note code{background:var(--paper-2,#efeae0); padding:1px 5px; border-radius:4px; font-size:.9em}
.reglages-backup-act{display:flex; gap:8px; flex-wrap:wrap}
.reglages-file{display:none}

.qlist{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:9px}
.qrow{display:flex; align-items:center; justify-content:space-between; gap:12px; border:1px solid var(--line); border-radius:9px; padding:11px 13px; background:#fff}
.qrow-num{font-family:var(--mono); font-weight:600; font-size:13.5px}
.qrow-meta{font-size:11.5px; color:var(--ink-3); margin-top:2px}
.qrow-act{display:flex; gap:7px; flex-wrap:wrap; justify-content:flex-end}
.qtools{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:8px}
.qtools-note{margin:0 0 14px; font-size:12px; line-height:1.5}
.devis-file{display:none}
.client-ac-wrap{position:relative; display:block}
.client-ac{top:calc(100% + 2px)}
.clients-search{flex:1 1 240px; min-width:0}
.crow{align-items:flex-start}
.crow-main{flex:1; min-width:0}
.crow-link{color:var(--oak-2); text-decoration:underline; margin-left:0}
.qrow-meta > * + *::before{content:" · "; color:var(--ink-3); text-decoration:none; display:inline-block; margin:0 4px}
.crow-quotes{list-style:none; margin:4px 0 0; padding:0; display:flex; flex-direction:column; gap:2px}
.linkish{background:none; border:0; padding:2px 0; color:var(--oak-2); cursor:pointer; font:inherit; font-size:12px; text-decoration:underline}
.chip-pro{margin-left:8px; background:#e2dae6; color:#5b4769; font-size:9.5px; vertical-align:middle}
.cform{border:1px solid var(--line); border-radius:9px; padding:12px; margin:0 0 12px; background:#fff; width:100%}
.ihint{display:none}
.install-steps{margin:6px 0 10px 18px; padding:0; font-size:13px; line-height:1.6}
.install-state{color:var(--green)}
.pw-msg{margin:10px 0 0; padding:8px 10px; border-radius:7px; font-size:13px}
.pw-ok{background:#e2eee5; color:#2d5238}
.pw-err{background:#f6e9e2; color:#7c2a1d}
.btn:disabled{opacity:.55; cursor:default}
.bar-user{align-self:center; font-size:12px; color:#c9bda6; padding:0 4px; letter-spacing:.02em}
.syncbar{background:#f6e9e2; border-bottom:2px solid var(--brick); color:#7c2a1d; padding:9px 18px; font-size:13px; display:flex; gap:10px; align-items:center; flex-wrap:wrap}
.btn.ghost-dark{background:transparent; color:var(--ink-2); border:1px solid var(--line)}
.btn.ghost-dark:hover{background:var(--line-2)}
.boot{padding:60px 20px; text-align:center}
.login-wrap{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; background:var(--paper); font-family:var(--body); color:var(--ink)}
.login-overlay{position:fixed; inset:0; z-index:80; background:rgba(28,24,18,.7)}
.login{width:100%; max-width:360px; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:24px 22px; display:flex; flex-direction:column; gap:14px; box-shadow:0 20px 60px rgba(0,0,0,.25)}
.login .brand{margin-right:0}
.login-name{color:var(--ink)}
.login-sub{color:var(--ink-3)}
.login-btn{padding:10px 14px; font-size:13.5px}
.login-btn:disabled{opacity:.55; cursor:default}
.login-err{background:#f6e9e2; border:1px solid var(--brick); color:#7c2a1d; border-radius:7px; padding:8px 10px; font-size:12.5px}
.migr-info{margin:0 0 12px; padding:8px 10px; border-radius:7px; background:var(--line-2); font-size:13px}
.migr-done{background:#e2eee5; color:#2d5238}
.migr-error{background:#f6e9e2; color:#7c2a1d}
.qtools-note code{background:var(--paper-2,#efeae0); padding:1px 5px; border-radius:4px; font-size:.9em}
.qnotice{border:1px solid var(--brick); background:#f6e9e2; border-radius:9px; padding:10px 12px; margin:0 0 14px}
.qnotice-info{border-color:var(--amber); background:#f7efdc}
.qnotice-todo{border-color:var(--ink-3); background:var(--line-2)}
.qtodo-note{margin:0 0 6px; font-size:12px}
.qpaste{border:1px solid var(--line); border-radius:9px; padding:10px 12px; margin:0 0 14px; background:#fff; display:flex; flex-direction:column; gap:8px}
.qpaste-ta{font-family:var(--mono); font-size:12px}
.qnotice-head{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:6px; font-size:13px}
.qnotice-body{margin:0 0 8px; font-family:var(--mono); font-size:11.5px; line-height:1.5; white-space:pre-wrap; word-break:break-word; max-height:220px; overflow:auto; user-select:text}
.qnotice-act{display:flex; align-items:center; gap:10px; flex-wrap:wrap; font-size:11.5px}

/* calepinage */
.cl .grid{margin-bottom:4px}
.cl-tog{height:38px; border:1px solid var(--line); border-radius:7px; padding:0 10px; background:#fff}
.cl-pieces{display:flex; flex-direction:column; gap:7px; margin-bottom:4px}
.cl-prow{display:grid; grid-template-columns:1fr 96px 96px 70px 30px; gap:8px; align-items:center}
.cl-prow .in{padding:7px 9px; font-size:13px}
.cl-prow-head{font-size:10.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-3); font-weight:600; padding:0 2px}
.cl-prow-head span:nth-child(2),.cl-prow-head span:nth-child(3),.cl-prow-head span:nth-child(4){text-align:right; padding-right:9px}
.cl-swatch-wrap{display:flex; align-items:center; gap:8px; min-width:0}
.cl-swatch{flex:none; width:14px; height:14px; border-radius:3px; border:1px solid rgba(0,0,0,.18)}
.cl-stats{margin-top:2px}
.cl-warn{background:#f6e9e2; border:1px solid var(--brick); color:#7c2a1d; border-radius:8px; padding:10px 12px; font-size:12.5px; margin:6px 0 14px; line-height:1.5}
.cl-sheets{display:flex; flex-wrap:wrap; gap:14px; margin:4px 0 6px}
.cl-sheet{margin:0; flex:1 1 320px; min-width:280px; max-width:520px}
.cl-sheet-cap{font-family:var(--mono); font-size:11px; color:var(--ink-3); margin-bottom:5px}
.cl-svg{display:block; width:100%; height:auto; background:#fff; border:1px solid var(--line); border-radius:6px}
.cl-panel{fill:#faf7f0; stroke:var(--ink-3); stroke-width:0; }
.cl-piece-lab{fill:var(--ink); font-family:var(--mono); font-weight:600; paint-order:stroke; stroke:#fff; stroke-width:.6; stroke-linejoin:round}
.cl-list{font-family:var(--mono); font-size:12px; white-space:pre; overflow:auto; background:#fff}
.cl-actions{justify-content:flex-end; align-items:center}

/* onglets matériaux + total tous matériaux */
.cl-mats{display:flex; flex-wrap:wrap; gap:7px; margin-bottom:14px}
.cl-mat{display:inline-flex; align-items:center; gap:8px; padding:7px 11px; border:1px solid var(--line); border-radius:8px; background:#fff; cursor:pointer; font:inherit; font-size:13px; color:var(--ink-2)}
.cl-mat:hover{border-color:var(--ink-3)}
.cl-mat.active{border-color:var(--oak-2); background:var(--oak-soft); color:var(--ink); font-weight:600; box-shadow:inset 0 0 0 1px var(--oak-2)}
.cl-mat-name{max-width:200px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.cl-mat-badge{font-family:var(--mono); font-size:11px; color:var(--ink-3)}
.cl-mat.active .cl-mat-badge{color:var(--oak-2)}
.cl-mat-x{display:inline-flex; align-items:center; justify-content:center; width:18px; height:18px; color:var(--ink-3); font-size:11px; border-radius:5px}
.cl-mat-x:hover{background:var(--brick); color:#fff}
.cl-mat-add{padding:7px 11px}
.cl-grand{display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap; margin-top:18px; padding:13px 15px; border:1px solid var(--oak-2); border-radius:9px; background:var(--oak-soft)}
.cl-grand-sum{display:flex; flex-direction:column; gap:2px; font-size:13px; color:var(--ink-2)}
.cl-grand-cost{font-family:var(--mono); font-size:16px; font-weight:700; color:var(--oak-2)}

/* formatage du texte libre */
.rich{display:flex; flex-direction:column}
.fmt-bar{display:flex; align-items:center; gap:4px; margin-bottom:5px; flex-wrap:wrap}
.fmt-btn{
  min-width:28px; height:26px; padding:0 7px; border:1px solid var(--line); background:#fff;
  border-radius:6px; cursor:pointer; color:var(--ink-2); font-family:var(--body); font-size:12.5px; line-height:1;
}
.fmt-btn:hover{border-color:var(--oak); color:var(--oak)}
.fmt-help{margin-left:auto; font-size:10.5px; color:var(--ink-3)}
.rt-preview{margin-top:6px; padding:8px 10px; border:1px dashed var(--line); border-radius:7px; background:#fffdf8; font-size:12.5px}
.rt-preview-lab{display:block; font-family:var(--display); font-size:9.5px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:var(--oak-2); margin-bottom:3px}
.rt p{margin:0; white-space:pre-wrap}
.rt p + p, .rt p + ul, .rt p + ol, .rt ul + p, .rt ol + p{margin-top:4px}
.rt ul, .rt ol{margin:3px 0; padding-left:20px}
.rt li{margin:0}
.in-ro{background:#f3efe6; color:var(--ink-2); cursor:default}

/* mètre linéaire (fournitures) */
.ml{padding:2px 12px 0}
.ml-toggle{margin:4px 0 6px}
.ml-box{border:1px solid var(--line); border-radius:8px; background:#fffdf8; padding:10px 11px; display:flex; flex-direction:column; gap:7px; margin-bottom:8px}
.ml-head{display:flex; align-items:center; gap:8px; font-size:10.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-3); font-weight:600}
.ml-unit{width:72px; padding:4px 6px; text-transform:none; letter-spacing:0}
.ml-row{display:grid; grid-template-columns:150px 80px 30px; gap:8px; align-items:center}
.ml-row .in{padding:7px 9px; font-size:13px}
.ml-foot{display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap}
.ml-perte{display:flex; align-items:center; gap:8px; font-size:11.5px; color:var(--ink-2)}
.ml-perte .numwrap{width:96px}
.ml-sum{display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; font-size:12px; color:var(--ink-2); border-top:1px dashed var(--line); padding-top:8px}
.ml-qte b{color:var(--oak-2)}

/* calepinage : barres / profilés */
.cl-prow-lin{grid-template-columns:1fr 110px 70px 30px}
.cl-bars{display:flex; flex-direction:column; gap:10px; margin:4px 0 6px}
.cl-bar{margin:0}
.cl-lin-add{padding:7px 11px}
.remise .cl-pu{width:104px; flex:none}
.cl-pu-note{margin:-6px 0 10px}

.toast{position:fixed; bottom:22px; left:50%; transform:translateX(-50%); background:var(--ink); color:#fff; padding:11px 20px; border-radius:8px; font-size:13px; font-weight:500; z-index:60; box-shadow:0 8px 24px rgba(0,0,0,.3)}

/* responsive */
@media (max-width:760px){
  .grid{grid-template-columns:repeat(2,1fr)}
  .line-body{grid-template-columns:repeat(2,1fr)}
  .sum-grid{grid-template-columns:repeat(2,1fr)}
  .bar{gap:10px}
  .brand-sub{display:none}
  .sheet{padding:26px 20px}
  .s-head{flex-direction:column}
  .s-meta{text-align:left}
  .s-metatab{margin-left:0}
  .s-parties{grid-template-columns:1fr}
  .s-totals{width:100%}
  .cl-prow{grid-template-columns:1fr 64px 64px 50px 28px; gap:6px}
  .cl-prow-lin{grid-template-columns:1fr 84px 50px 28px}
  .cl-sheet{max-width:none}
}

/* barre d'actions du bas : téléphone uniquement */
.mbar{display:none}
.btn-dirty{box-shadow:inset 0 0 0 2px #f3c27e}
.bar{padding-top:max(12px, env(safe-area-inset-top))}

/* téléphone : barre compacte, champs à 16 px (pas de zoom iOS), cibles tactiles ≥ 36 px */
@media (max-width:600px){
  .bar{padding:8px 12px; gap:8px; row-gap:8px}
  .brand{margin-right:0}
  .brand-mark{font-size:17px; padding:3px 6px}
  .brand-name{font-size:14px; letter-spacing:.16em}
  .flip{margin-left:auto}
  .flip-btn{padding:7px 11px; font-size:11.5px}
  .bar-actions{flex:1 1 100%; flex-wrap:nowrap; overflow-x:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none; padding-bottom:2px}
  .bar-actions::-webkit-scrollbar{display:none}
  .bar-actions .btn{flex:none; white-space:nowrap}
  .wrap{padding:14px 10px 60px; gap:14px}
  .card{padding:14px 12px 16px}
  .in, .in-sel, .ml-unit, textarea.in, .ml-row .in, .cl-prow .in, .line-title, .remise .in{font-size:16px}
  .ico{width:36px; height:36px; font-size:15px}
  .btn{min-height:36px}
  .btn.sm{min-height:34px}
  .fmt-btn{min-width:36px; height:34px}
  .fmt-help{display:none}
  .line-head{flex-wrap:wrap; row-gap:8px}
  .line-title-wrap{order:3; flex:1 1 100%}
  .line-ord{margin-left:auto}
  .line-body{padding:12px 10px 4px}
  .line-foot{flex-direction:column; align-items:flex-start}
  .ml-row{grid-template-columns:1fr 80px 36px}
  .ml-foot, .ml-sum{flex-direction:column; align-items:flex-start}
  .sheet-stage{padding:14px 8px 60px}
  .sheet{padding:20px 14px; font-size:12.5px}
  .s-table th, .s-table td{padding:7px 5px}
  .c-desc{width:auto}
  .cl-prow{grid-template-columns:1fr 1fr 1fr 36px}
  .cl-prow-lin{grid-template-columns:1fr 1fr 36px}
  .cl-prow > .cl-swatch-wrap, .cl-prow-head > span:first-child{grid-column:1/-1}
  .overlay{padding:0; display:block} /* bloc (pas flex) : la fenêtre grandit avec son contenu, fond compris */
  .modal, .modal-wide{max-width:none; border-radius:0; min-height:100%}
  .modal-head{position:sticky; top:0; background:var(--card); z-index:2}
  .modal-body{padding:14px 12px 40px}
  .qrow{flex-direction:column; align-items:stretch}
  .qrow-act{justify-content:flex-start}
  .sum-grid{gap:8px}
  .stat-val{font-size:16px}
  .stat-big .stat-val{font-size:19px}
  .toast{left:12px; right:12px; transform:none; text-align:center; bottom:calc(76px + env(safe-area-inset-bottom))}
  .bar{padding-top:max(8px, env(safe-area-inset-top)); padding-left:max(12px, env(safe-area-inset-left)); padding-right:max(12px, env(safe-area-inset-right))}
  .ihint{display:flex; align-items:center; gap:8px; margin:10px 10px 0; padding:8px 10px; border:1px solid var(--oak); border-radius:9px; background:var(--oak-soft); font-size:12.5px; color:var(--oak-2)}
  .ihint span{flex:1}
  .mbar{display:flex; align-items:center; gap:10px; position:fixed; left:0; right:0; bottom:0; z-index:40;
    padding:8px 12px calc(8px + env(safe-area-inset-bottom)); background:var(--ink); color:#f4efe6;
    border-top:3px solid var(--oak); box-shadow:0 -6px 18px rgba(0,0,0,.18)}
  .mbar-sum{flex:1; min-width:0; display:flex; flex-direction:column; line-height:1.2; cursor:pointer}
  .mbar-lab{font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; color:#b3a892}
  .mbar-val{font-size:17px; font-weight:600; color:#fff}
  .mbar-marge{font-size:11.5px; font-weight:600; filter:brightness(1.5)}
  .mbar-save{flex:none; min-height:44px; padding:10px 16px; font-size:14px}
  .bar-actions > .btn:not(.ghost){display:none}
  .wrap, .sheet-stage{padding-bottom:calc(96px + env(safe-area-inset-bottom))}
  .modal-body{padding-bottom:calc(40px + env(safe-area-inset-bottom))}
}

/* print */
@media print{
  @page{margin:14mm}
  body *{visibility:hidden}
  .sheet, .sheet *{visibility:visible}
  .sheet{position:absolute; left:0; top:0; width:100%; box-shadow:none; border:0; border-radius:0; padding:0}
  .no-print{display:none !important}
}
`;

ReactDOM.createRoot(document.getElementById("root")).render(<Root />);
</script>
</body>
