<!-- localStorage-backed shim for the async window.storage API the app expects -->
<script>
window.storage = {
  get: async (key) => {
    try { const v = localStorage.getItem(key); return v == null ? null : { value: v }; }
    catch (e) { return null; }
  },
  set: async (key, value) => {
    try { localStorage.setItem(key, value); } catch (e) {}
  },
};
</script>

/* ---------- texte enrichi (gras / italique / souligné / listes) ----------
   Le texte reste une simple chaîne (balisage léger **gras** *italique*
   __souligné__, « - » puces, « 1. » numérotation) ; tout le parsing et la
   logique de la barre d'outils vivent dans lib/etabli-core.js. Le rendu produit
   des éléments React — jamais de HTML injecté. */
function RichText({ text, className }) {
  const blocks = useMemo(() => parseRichText(text), [text]);
  const runs = (rs) =>
    rs.map((r, i) => {
      let el = r.text;
      if (r.u) el = <u>{el}</u>;
      if (r.i) el = <em>{el}</em>;
      if (r.b) el = <strong>{el}</strong>;
      return <React.Fragment key={i}>{el}</React.Fragment>;
    });
  return (
    <div className={"rt" + (className ? " " + className : "")}>
      {blocks.map((b, i) =>
        b.type === "p" ? (
          <p key={i}>{runs(b.runs)}</p>
        ) : b.type === "ul" ? (
          <ul key={i}>{b.items.map((it, j) => <li key={j}>{runs(it)}</li>)}</ul>
        ) : (
          <ol key={i} start={b.start}>{b.items.map((it, j) => <li key={j}>{runs(it)}</li>)}</ol>
        )
      )}
    </div>
  );
}

const FORMAT_BUTTONS = [
  { kind: "bold", label: <b>G</b>, title: "Gras (Ctrl+B)", aria: "Gras" },
  { kind: "italic", label: <i>I</i>, title: "Italique (Ctrl+I)", aria: "Italique" },
  { kind: "underline", label: <u>S</u>, title: "Souligné (Ctrl+U)", aria: "Souligné" },
  { kind: "ul", label: "•", title: "Liste à puces", aria: "Liste à puces" },
  { kind: "ol", label: "1.", title: "Liste numérotée", aria: "Liste numérotée" },
];
const FORMAT_KEYS = { b: "bold", i: "italic", u: "underline" };

function RichArea({ value, onChange, placeholder, rows = 2, preview = true }) {
  const ref = useRef(null);
  const pending = useRef(null); // sélection à restaurer après le re-rendu contrôlé
  useEffect(() => {
    const sel = pending.current;
    if (sel && ref.current) {
      pending.current = null;
      ref.current.focus();
      ref.current.setSelectionRange(sel.start, sel.end);
    }
  });
  const apply = (kind) => {
    const ta = ref.current;
    if (!ta) return;
    const r = applyTextFormat(ta.value, ta.selectionStart, ta.selectionEnd, kind);
    if (r.text === ta.value) {
      ta.focus();
      ta.setSelectionRange(r.start, r.end);
      return;
    }
    pending.current = { start: r.start, end: r.end };
    onChange(r.text);
  };
  const text = value ?? "";
  return (
    <div className="rich">
      <div className="fmt-bar" role="toolbar" aria-label="Mise en forme">
        {FORMAT_BUTTONS.map((b) => (
          <button
            key={b.kind}
            type="button"
            className="fmt-btn"
            title={b.title}
            aria-label={b.aria}
            data-fmt={b.kind}
            // mousedown + preventDefault : le champ garde le focus et la sélection.
            onMouseDown={(e) => e.preventDefault()}
            onClick={() => apply(b.kind)}
          >
            {b.label}
          </button>
        ))}
        <span className="fmt-help">**gras** · *italique* · __souligné__ · « - » puce</span>
      </div>
      <textarea
        ref={ref}
        className="in in-area"
        rows={rows}
        value={text}
        placeholder={placeholder || ""}
        onChange={(e) => onChange(e.target.value)}
        onKeyDown={(e) => {
          const kind = (e.ctrlKey || e.metaKey) && !e.altKey ? FORMAT_KEYS[e.key.toLowerCase()] : null;
          if (kind) {
            e.preventDefault();
            apply(kind);
          }
        }}
      />
      {preview && hasRichFormatting(text) ? (
        <div className="rt-preview">
          <span className="rt-preview-lab">Aperçu</span>
          <RichText text={text} />
        </div>
      ) : null}
    </div>
  );
}
// Comme Field, mais sans <label> englobant : la barre d'outils contient des

/* ---------- calepinage (cutlist) ---------- */
const PIECE_PALETTE = [
  "#A8631F", "#3D6B4A", "#2E567C", "#8A5018",
  "#5B4769", "#C08A2E", "#7A5A1C", "#39593F",
];
const newPiece = (i = 0) => ({
  id: uid(),
  label: "",
  w: "",
  h: "",
  qty: "1",
  color: PIECE_PALETTE[i % PIECE_PALETTE.length],
});
// Un « matériau » = un type de panneau (cote + prix au m² + sens du fil) avec sa
// propre liste de pièces. Un calepinage peut en empiler plusieurs (p. ex. MDF
// 18 mm à 30 €/m² ET aglo 8 mm à 15 €/m²) : chacun se débite sur SES plaques —
// on ne mélange jamais deux matières sur une même plaque — et chacun produit sa
// propre ligne de devis. Tout est en millimètres ; le prix matière est au m².
// `kind` : "panel" (plaque, prix au m²) ou "linear" (barre / profilé / baguette
// débitée en long, prix au ml ou à la barre). Pour un matériau linéaire, `w` des
// pièces est la longueur (mm) ; `h` est ignoré.
const newMaterial = (i = 0, kind = "panel") => ({
  id: uid(),
  kind,
  material: "",
  pricePerM2: "",
  panelW: "2500",
  panelH: "1250",
  kerf: "3",
  grainDirection: false,
  barLen: "2400", // longueur d'une barre de stock (mm)
  linPrice: "", // prix saisi (€/ml ou €/barre selon linPriceUnit)
  linPriceUnit: "ml", // "ml" | "bar"
  linBilling: "bar", // "bar" = barres entières · "ml" = mètres réellement débités
  pieces: [],
});
const FIRST_MATERIAL = newMaterial(0);
const DEFAULT_CALEP = { materials: [FIRST_MATERIAL], activeId: FIRST_MATERIAL.id };

// Mise à niveau du format stocké. L'ancien atelier ne gardait qu'un seul
// panneau (`{ material, panelW, …, pieces }`) ; on l'enveloppe dans la liste
// `materials` pour ne rien perdre des devis déjà commencés.
function migrateCalep(raw) {
  if (!raw || typeof raw !== "object") return { materials: [newMaterial(0)], activeId: null };
  let materials;
  if (Array.isArray(raw.materials)) {
    materials = raw.materials.map((m, i) => ({
      ...newMaterial(i),
      ...m,
      id: m && m.id ? m.id : uid(),
      pieces: Array.isArray(m && m.pieces) ? m.pieces : [],
    }));
  } else {
    materials = [{
      ...newMaterial(0),
      material: raw.material != null ? raw.material : "",
      pricePerM2: raw.pricePerM2 != null ? raw.pricePerM2 : "",
      panelW: raw.panelW != null ? raw.panelW : "2500",
      panelH: raw.panelH != null ? raw.panelH : "1250",
      kerf: raw.kerf != null ? raw.kerf : "3",
      grainDirection: !!raw.grainDirection,
      pieces: Array.isArray(raw.pieces) ? raw.pieces : [],
    }];
  }
  if (!materials.length) materials = [newMaterial(0)];
  const activeId = materials.some((m) => m.id === raw.activeId) ? raw.activeId : materials[0].id;
  return { materials, activeId };
}

const nf1 = (n) => (isFinite(n) ? n : 0).toLocaleString("fr-BE", { maximumFractionDigits: 1 });
const nf2 = (n) => (isFinite(n) ? n : 0).toLocaleString("fr-BE", { maximumFractionDigits: 2 });

// Calepinage + métrique d'UN matériau (pur, sans DOM) : on convertit les
// champs de saisie (w/h/qty en chaînes) vers le noyau, puis on délègue tout le
// calcul à etabli-core (source unique de vérité).
function computeMaterial(mat) {
  if (mat.kind === "linear") return computeLinearMaterial(mat);
  const config = {
    width: num(mat.panelW),
    height: num(mat.panelH),
    kerf: num(mat.kerf),
    grainDirection: !!mat.grainDirection,
  };
  const piecesForCore = mat.pieces.map((p) => ({
    id: p.id, label: p.label,
    width: num(p.w), height: num(p.h), quantity: num(p.qty), color: p.color,
  }));
  const result = calculateCutlist(piecesForCore, config);
  const metrics = panelMetrics(result, config, num(mat.pricePerM2), 0.001);
  const cutList = cutListText(piecesForCore, { unit: "mm" });
  const hasPieces = piecesForCore.some((p) => p.width > 0 && p.height > 0 && p.quantity > 0);
  return { id: mat.id, kind: "panel", units: metrics.totalSheets, config, piecesForCore, result, metrics, cutList, hasPieces };
}

// Équivalent pour un matériau LINÉAIRE (barre, baguette, profilé) : découpe 1D
// dans des barres de stock, coût au ml ou à la barre selon la saisie.
function computeLinearMaterial(mat) {
  const config = { barLength: num(mat.barLen), kerf: num(mat.kerf) };
  const piecesForCore = mat.pieces.map((p) => ({
    id: p.id, label: p.label, length: num(p.w), quantity: num(p.qty), color: p.color,
  }));
  const result = calculateLinearCutlist(piecesForCore, config);
  const metrics = linearMetrics(result, config, num(mat.linPrice), {
    priceUnit: mat.linPriceUnit, billing: mat.linBilling, unitToM: 0.001,
  });
  const cutList = linearCutListText(piecesForCore, { unit: "mm" });
  const hasPieces = piecesForCore.some((p) => p.length > 0 && p.quantity > 0);
  return { id: mat.id, kind: "linear", units: metrics.totalBars, config, piecesForCore, result, metrics, cutList, hasPieces };
}

const round4 = (n) => Math.round(n * 10000) / 10000;

// Ligne « fourniture » d'un matériau linéaire : soit N barres entières au prix
// de la barre, soit les mètres réellement débités au prix du ml.
function buildLinearCalepLine(mat, comp, marge) {
  const { metrics, cutList } = comp;
  const byMl = metrics.billing === "ml";
  const detail = [
    `${metrics.totalBars} barre(s) de ${num(mat.barLen)} mm — chute ${nf1(metrics.totalWastePercent)} %` +
      (byMl ? ` — facturé au mètre débité (${nf2(metrics.usedM)} ml)` : ""),
    cutList.text,
  ].join("\n");
  return {
    id: uid(),
    type: "fourniture",
    designation: (mat.material || "Profilé") + " — débit calepiné",
    detail,
    showDetail: true,
    showQty: true,
    qte: byMl ? String(round4(metrics.usedM)) : String(metrics.totalBars),
    unite: byMl ? "ml" : "barre",
    pa: byMl ? String(round4(metrics.pricePerMl)) : String(Math.round(metrics.pricePerBar * 100) / 100),
    tvaRate: "",
    mlOn: false, mlItems: [], mlUnit: "m", mlPerte: "",
    marge,
    heures: "",
    tauxVente: "",
    coutHoraire: "",
  };
}

// Ligne « fourniture » correspondant à un matériau calepiné : N panneaux entiers
// au coût/panneau, avec la liste de débit pliée dans le métré.
function buildCalepLine(mat, comp, marge) {
  if (comp.kind === "linear") return buildLinearCalepLine(mat, comp, marge);
  const { metrics, cutList } = comp;
  const detail = [
    `${metrics.totalSheets} panneau(x) ${num(mat.panelW)}×${num(mat.panelH)} mm — chute ${nf1(metrics.totalWastePercent)} %`,
    cutList.text,
  ].join("\n");
  return {
    id: uid(),
    type: "fourniture",
    designation: (mat.material || "Panneau") + " — débit calepiné",
    detail,
    showDetail: true,
    showQty: true,
    qte: String(metrics.totalSheets),
    unite: "panneau",
    pa: (Math.round(metrics.costPerPanel * 100) / 100).toString(),
    tvaRate: "",
    marge,
    heures: "",
    tauxVente: "",
    coutHoraire: "",
  };
}

/* =========================================================================
   ROOT — choisit la couche de stockage (serveur ÉTABLI ou navigateur seul) et gère la connexion
   ========================================================================= */
function Login({ store, onDone, overlay }) {
  const [login, setLogin] = useState("");
  const [pw, setPw] = useState("");
  const [err, setErr] = useState("");
  const [busy, setBusy] = useState(false);
  const submit = async (e) => {
    e.preventDefault();
    setBusy(true);
    setErr("");
    const r = await store.login(login, pw);
    if (r.ok) {
      const me = await store.me();
      setBusy(false);
      onDone(me);
      return;
    }
    setBusy(false);
    setPw("");
    setErr(r.kind === "locked" ? `${r.message} Réessayez dans ${Math.max(1, Math.ceil((r.retryAfter || 60) / 60))} min.` : r.message);
  };
  return (
    <div className={"login-wrap" + (overlay ? " login-overlay" : "")}>
      <style>{CSS}</style>
      <form className="login" onSubmit={submit}>
        <div className="brand">
          <div className="brand-mark">▟▙</div>
          <div>
            <div className="brand-name login-name">ÉTABLI</div>
            <div className="brand-sub login-sub">devis de menuiserie</div>
          </div>
        </div>
        {overlay ? <p className="muted">Votre session a expiré. Reconnectez-vous : vos modifications en cours restent à l'écran.</p> : null}
        <Field label="Identifiant">
          <input className="in" type="text" name="login" autoComplete="username" autoFocus value={login} onChange={(e) => setLogin(e.target.value)} />
        </Field>
        <Field label="Mot de passe">
          <input className="in" type="password" name="password" autoComplete="current-password" value={pw} onChange={(e) => setPw(e.target.value)} />
        </Field>
        {err ? <div className="login-err" role="alert">{err}</div> : null}
        <button className="btn login-btn" type="submit" disabled={busy || !login || !pw}>
          {busy ? "Connexion…" : "Se connecter"}
        </button>
      </form>
    </div>
  );
}

function Root() {
  const [boot, setBoot] = useState({ phase: "loading", me: null }); // loading | login | ready | relogin
  const [epoch, setEpoch] = useState(0);
  const storeRef = useRef(null);
  useEffect(() => {
    (async () => {
      const d = await detectBackend(window.fetch.bind(window));
      if (d.mode === "local") {
        storeRef.current = createLocalStore(window.storage);
        setBoot({ phase: "ready", me: null });
        return;
      }
      // Session expirée en cours de route : on garde l'application à l'écran (modifications
      // non enregistrées incluses) et on superpose la connexion.
      storeRef.current = createServerStore(window.fetch.bind(window), () =>
        setBoot((b) => (b.phase === "ready" ? { ...b, phase: "relogin" } : b))
      );
      setBoot(d.authed ? { phase: "ready", me: d.me } : { phase: "login", me: null });
    })();
  }, []);
  const logout = async () => {
    await storeRef.current.logout();
    setBoot({ phase: "login", me: null });
  };
  if (boot.phase === "loading") {
    return (
      <div className="app">
        <style>{CSS}</style>
        <div className="boot muted">Chargement…</div>
      </div>
    );
  }
  if (boot.phase === "login") {
    return <Login store={storeRef.current} onDone={(me) => { setEpoch((n) => n + 1); setBoot({ phase: "ready", me }); }} />;
  }
  return (
    <>
      <App key={epoch} store={storeRef.current} me={boot.me} onLogout={logout} />
      {boot.phase === "relogin" ? <Login overlay store={storeRef.current} onDone={(me) => setBoot({ phase: "ready", me: me || boot.me })} /> : null}
    </>
  );
}

/* ---------- migration : récupérer les données du navigateur depuis l'ancienne adresse ---------- */
function migrationSummary(s) {
  if (!s) return "";
  const q = s.quotes || {};
  const parts = [`${q.added || 0} devis ajouté(s)`];
  if (q.duplicates) parts.push(`${q.duplicates} déjà présent(s)`);
  if (q.copies) parts.push(`${q.copies} ajouté(s) comme copie`);
  if (s.catalogue && s.catalogue.added) parts.push(`${s.catalogue.added} article(s) de catalogue`);
  if (s.settings) parts.push("réglages repris");
  return parts.join(" · ");
}
function MigrationModal({ legacyUrl, store, onImported, onSkip, onClose }) {
  const [phase, setPhase] = useState("idle"); // idle | waiting | importing | done | error
  const [info, setInfo] = useState("");
  const popup = useRef(null);
  const base = legacyUrl.replace(/\/?$/, "/");
  const origin = useMemo(() => { try { return new URL(base).origin; } catch (e) { return ""; } }, [base]);
  useEffect(() => {
    // Protocole postMessage (voir migrate.html) : on n'accepte que l'origine ET la fenêtre attendues.
    const onMsg = async (ev) => {
      if (!origin || ev.origin !== origin || ev.source !== popup.current) return;
      const d = ev.data || {};
      if (d.type === "etabli-migrate:ready") {
        ev.source.postMessage({ type: "etabli-migrate:request" }, origin);
        setInfo("Confirmez l'envoi dans la fenêtre qui vient de s'ouvrir.");
      } else if (d.type === "etabli-migrate:cancel") {
        setPhase("idle");
        setInfo("Migration annulée.");
      } else if (d.type === "etabli-migrate:data") {
        setPhase("importing");
        setInfo("Envoi au serveur…");
        const r = await store.importBackup(d.backup);
        if (r.ok) {
          setPhase("done");
          setInfo(migrationSummary(r.summary) || "Rien de nouveau à ajouter.");
          onImported(r.summary);
        } else {
          setPhase("error");
          setInfo(r.message);
        }
      }
    };
    window.addEventListener("message", onMsg);
    return () => window.removeEventListener("message", onMsg);
  }, [origin]);
  const start = () => {
    // nom unique : une fenêtre de migration encore ouverte n'est pas réutilisée par erreur
    const w = window.open(base + "migrate.html", "etabli-migrate-" + Date.now(), "width=520,height=640");
    if (!w) { setPhase("error"); setInfo("Le navigateur a bloqué la fenêtre. Autorisez les fenêtres pour ce site, puis réessayez."); return; }
    popup.current = w;
    setPhase("waiting");
    setInfo("Fenêtre ouverte…");
  };
  return (
    <div>
      <p className="muted reglages-backup-note">
        Jusqu'ici, vos devis étaient enregistrés dans le navigateur, à l'adresse <code>{origin}</code>.
        Cliquez sur « Récupérer » : une fenêtre s'ouvre, vous confirmez l'envoi, et ils sont <strong>ajoutés</strong> à
        votre compte (rien n'est supprimé, rien de ce que le serveur contient déjà n'est écrasé).
      </p>
      {info ? <p className={"migr-info migr-" + phase} role="status">{info}</p> : null}
      <div className="reglages-backup-act">
        {phase !== "done" ? (
          <button className="btn" onClick={start} disabled={phase === "waiting" || phase === "importing"}>Récupérer mes données</button>
        ) : null}
        {phase !== "done" && onSkip ? <button className="btn ghost-dark" onClick={onSkip}>Je n'ai rien à récupérer</button> : null}
        <button className="btn ghost-dark" onClick={onClose}>{phase === "done" ? "Fermer" : "Plus tard"}</button>
      </div>
    </div>
  );
}

/* =========================================================================
   APP
   ========================================================================= */
function App({ store, me, onLogout }) {
  const [view, setView] = useState("atelier"); // 'atelier' | 'client'
  const [company, setCompany] = useState(DEFAULT_COMPANY);
  const [params, setParams] = useState(DEFAULT_PARAMS);
  const [devis, setDevis] = useState(() => newDevis(DEFAULT_COMPANY, DEFAULT_PARAMS));
  const [saved, setSaved] = useState([]);
  const [importTodo, setImportTodo] = useState(null); // [{ path, message }] — champs laissés vides par l'IA
  const [importNotice, setImportNotice] = useState(null); // { level, title, body, feedback } — résultat de l'import d'un devis
  const savedRef = useRef([]); // dernier `saved` — lu par les callbacks asynchrones (FileReader)
  savedRef.current = saved;
  const [catalog, setCatalog] = useState([]); // fournitures réutilisables
  const [clients, setClients] = useState([]); // fiches clients (coordonnées réutilisables)
  const clientsRef = useRef([]);
  clientsRef.current = clients;
  const [modal, setModal] = useState(null); // 'reglages' | 'mesdevis' | 'catalogue' | 'calepinage' | null
  const [toast, setToast] = useState("");
  // Devis « non enregistré » : comparaison avec la dernière version chargée / enregistrée.
  const [installable, setInstallable] = useState(!!window.__etabliInstall);
  useEffect(() => {
    const on = () => setInstallable(!!window.__etabliInstall);
    window.addEventListener("etabli-installable", on);
    return () => window.removeEventListener("etabli-installable", on);
  }, []);
  const installApp = async () => {
    const ev = window.__etabliInstall;
    if (!ev) return;
    ev.prompt();
    try { await ev.userChoice; } catch (e) {}
    window.__etabliInstall = null;
    setInstallable(false);
  };
  const [installHintSeen, setInstallHintSeen] = useState(() => { try { return localStorage.getItem("etabli:installHint") === "vu"; } catch (e) { return true; } });
  const dismissInstallHint = () => { setInstallHintSeen(true); try { localStorage.setItem("etabli:installHint", "vu"); } catch (e) {} };
  const savedSnap = useRef(null);
  const devisJSON = JSON.stringify(devis);
  if (savedSnap.current === null) savedSnap.current = devisJSON;
  const dirty = devisJSON !== savedSnap.current;
  const [calep, setCalep] = useState(DEFAULT_CALEP);
  const loaded = useRef(false);
  const lastCalep = useRef(JSON.stringify(DEFAULT_CALEP)); // dernier calepinage enregistré (évite les écritures inutiles)
  const [syncError, setSyncError] = useState(null); // dernière écriture échouée { kind, message }
  const serverMode = store.mode === "server";

  /* applique les données chargées (au démarrage, et après une migration) */
  const applyData = (data, opts) => {
    if (data.settings) {
      if (data.settings.company) setCompany((c) => ({ ...c, ...data.settings.company }));
      if (data.settings.params) setParams((p) => ({ ...p, ...data.settings.params }));
    }
    // Devis hérités : garantir un id stable à chacun (sinon la suppression et le
    // dédoublonnage retombent sur le numéro, qui peut collisionner). On re-persiste
    // si une migration a eu lieu.
    const raw = data.quotes || [];
    let migrated = false;
    const withIds = raw.map((x) => {
      if (x && (x.id == null || x.id === "")) { migrated = true; return { ...x, id: newQuoteId() }; }
      return x;
    });
    savedRef.current = withIds;
    setSaved(withIds);
    if (migrated) persistQuotes(withIds, raw);
    if (data.calepinage) {
      const m = migrateCalep(data.calepinage);
      lastCalep.current = JSON.stringify(m);
      setCalep(m);
    }
    setCatalog(data.catalogue || []);
    // Fiches clients : si le carnet n'a jamais été créé, on le construit à partir des devis existants.
    if (Array.isArray(data.clients)) {
      clientsRef.current = data.clients;
      setClients(data.clients);
    } else {
      const built = clientsFromQuotes(withIds);
      clientsRef.current = built;
      setClients(built);
      if (built.length) persistClients(built);
    }
    // Au démarrage, le devis vierge affiché a été créé AVANT le chargement : on le recrée avec
    // le prochain numéro libre (pas « 001 » quand des devis existent) et les réglages enregistrés.
    if (opts && opts.startup) {
      const s = data.settings || {};
      const fresh = newDevis({ ...DEFAULT_COMPANY, ...(s.company || {}) }, { ...DEFAULT_PARAMS, ...(s.params || {}) }, withIds);
      setDevis((d) => {
        if (JSON.stringify(d) !== savedSnap.current) return d; // l'utilisateur a déjà commencé : on ne touche à rien
        savedSnap.current = JSON.stringify(fresh);
        return fresh;
      });
    }
  };

  /* load persisted state (localStorage ou serveur, selon la couche de stockage) */
  useEffect(() => {
    (async () => {
      try {
        const data = await store.loadAll();
        applyData(data, { startup: true });
        // 1re connexion sur le serveur : proposer de récupérer les devis de l'ancienne adresse.
        if (serverMode && data.migrated === false && me && me.legacyUrl) setModal("migration");
        loaded.current = true;
      } catch (e) {
        // Serveur injoignable au démarrage : on N'autorise PAS les écritures (elles risqueraient
        // d'écraser les vraies données par des valeurs par défaut).
        setSyncError({ kind: (e && e.kind) || "network", message: (e && e.message) || "Chargement impossible.", fatal: true });
      }
    })();
  }, []);

  /* persist the calepinage workbench whenever it changes (after first load) */
  useEffect(() => {
    if (!loaded.current) return;
    const snap = JSON.stringify(calep);
    if (snap === lastCalep.current) return;
    // petite temporisation : en mode serveur, pas une requête par frappe
    const t = setTimeout(() => { lastCalep.current = snap; track(store.saveCalepinage(calep)); }, serverMode ? 600 : 0);
    return () => clearTimeout(t);
  }, [calep]);

  const flash = (m, ms = 2200) => {
    setToast(m);
    setTimeout(() => setToast(""), ms);
  };

  // Suit une écriture : en cas d'échec, un bandeau le dit (et ne disparaît qu'au prochain succès).
  const track = async (promise) => {
    const r = await promise;
    if (r && r.ok === false) setSyncError((cur) => (cur && cur.fatal ? cur : r));
    else setSyncError((cur) => (cur && cur.fatal ? cur : null));
    return r;
  };
  const persistSettings = (c, p) => track(store.saveSettings({ company: c, params: p }));
  // prev : liste avant modification (le mode serveur n'envoie que la différence)
  const persistQuotes = (list, prev) => track(store.syncQuotes(prev || [], list));
  const persistCatalog = (list) => track(store.saveCatalog(list));
  // Fiches clients : écrites en même temps qu'un devis. Un succès ici ne doit PAS effacer
  // l'alerte d'un enregistrement de devis qui, lui, a échoué (conflit, réseau) → on ne signale que les échecs.
  const persistClients = async (list) => {
    const r = await store.saveClients(list);
    if (r && r.ok === false) setSyncError((cur) => (cur && cur.fatal ? cur : r));
    return r;
  };
  const commitClients = (compute) => {
    const next = compute(clientsRef.current);
    clientsRef.current = next;
    setClients(next);
    persistClients(next);
    return next;
  };
  // Applique un changement de la liste des devis : état, puis écriture (sans effet de bord dans un updater React).
  const commitQuotes = (compute) => {
    const prev = savedRef.current;
    const next = compute(prev);
    savedRef.current = next;
    setSaved(next);
    persistQuotes(next, prev);
    return next;
  };

  /* ---------- totals ---------- */
  const calc = useMemo(() => {
    let cout = 0;
    let venteHT = 0;
    const rows = devis.lines.map((l) => {
      const c = computeLine(l);
      cout += c.cout;
      venteHT += c.vente;
      // Keep computed values on DISTINCT keys (qteNum / uniteOut / margeEur).
      // Spreading c directly used to overwrite the raw text inputs the LineCard
      // is bound to (qte / unite / marge) — so typing a digit made another value
      // appear. The raw strings from `l` must survive untouched.
      return {
        ...l,
        cout: c.cout,
        vente: c.vente,
        puv: c.puv,
        qteNum: c.qte,
        uniteOut: c.unite,
        margeEur: c.vente - c.cout,
      };
    });
    const remise =
      devis.remiseType === "pct"
        ? venteHT * (num(devis.remiseVal) / 100)
        : num(devis.remiseVal);
    const deplacement = num(devis.deplacement);
    const coutTotal = cout + num(devis.deplacementCout);

    // Taux effectif par poste : pro (cocontractant) → 0 partout ; sinon les
    // fournitures prennent leur taux dédié si défini, le reste suit le taux
    // principal (la « facture finale »). Le déplacement suit le taux principal.
    const coco = devis.clientType === "pro";
    const mainRate = num(devis.tvaRate);
    const fournRate =
      devis.tvaFournitures === "" || devis.tvaFournitures == null
        ? null
        : num(devis.tvaFournitures);
    // Priorité du taux : cocontractant (0) > override de la ligne >
    // taux fournitures du devis (pour les fournitures) > taux principal.
    const lineOverride = (l) =>
      l.tvaRate === "" || l.tvaRate == null ? null : num(l.tvaRate);
    const taxRows = rows.map((l) => {
      let rate;
      if (coco) rate = 0;
      else if (lineOverride(l) != null) rate = lineOverride(l);
      else if (l.type === "fourniture" && fournRate != null) rate = fournRate;
      else rate = mainRate;
      return { vente: l.vente, rate };
    });
    const t = tvaBreakdown(taxRows, {
      remise,
      deplacement,
      deplacementRate: coco ? 0 : mainRate,
    });
    // Toujours au moins un groupe à afficher (devis vide → taux principal à 0 €).
    const tvaGroups = t.groups.length
      ? t.groups
      : [{ rate: coco ? 0 : mainRate, base: 0, tva: 0 }];
    const baseHT = t.baseHT;
    const tva = t.tva;
    const ttc = t.ttc;
    const marge = baseHT - coutTotal;
    const margePct = baseHT > 0 ? (marge / baseHT) * 100 : 0;
    const acompte = ttc * (num(devis.acompte) / 100);
    return {
      rows,
      coutTotal,
      venteHT,
      remise,
      deplacement,
      baseHT,
      coco,
      tvaGroups,
      tvaMixed: tvaGroups.length > 1,
      tva,
      ttc,
      marge,
      margePct,
      acompte,
    };
  }, [devis]);

  const margeColor = (p) => {
    const cible = num(params.margeCible);
    if (p >= cible) return "var(--green)";
    if (p >= cible * 0.5) return "var(--amber)";
    return "var(--brick)";
  };

  /* ---------- mutations ---------- */
  const setLine = (id, patch) =>
    setDevis((d) => ({
      ...d,
      lines: d.lines.map((l) => (l.id === id ? { ...l, ...patch } : l)),
    }));
  const focusNewLine = useRef(false);
  const addLine = (type) => {
    focusNewLine.current = true; // ligne ajoutée par l'utilisateur : la montrer et placer le curseur
    setDevis((d) => ({ ...d, lines: [...d.lines, newLine(type, params)] }));
  };
  // Nouvelle ligne : on la fait défiler à l'écran (sur téléphone elle apparaissait hors de vue).
  const prevLines = useRef(devis.lines.length);
  useEffect(() => {
    if (devis.lines.length > prevLines.current) {
      const all = document.querySelectorAll(".lines > .line");
      const last = all[all.length - 1];
      if (last && last.scrollIntoView) last.scrollIntoView({ block: "center", behavior: "smooth" });
      if (focusNewLine.current && last) { const t = last.querySelector(".line-title"); if (t) t.focus({ preventScroll: true }); }
    }
    focusNewLine.current = false;
    prevLines.current = devis.lines.length;
  }, [devis.lines.length]);
  // Prévenir avant de quitter avec un devis non enregistré.
  useEffect(() => {
    const onBefore = (e) => { if (dirty) { e.preventDefault(); e.returnValue = ""; } };
    window.addEventListener("beforeunload", onBefore);
    return () => window.removeEventListener("beforeunload", onBefore);
  }, [dirty]);
  // Bouton / geste « retour » (Android, application installée) : ferme la fenêtre ouverte au lieu de quitter.
  const modalInHistory = useRef(false);
  useEffect(() => {
    if (modal && !modalInHistory.current) {
      try { history.pushState({ etabliModal: true }, ""); modalInHistory.current = true; } catch (e) {}
    } else if (!modal && modalInHistory.current) {
      modalInHistory.current = false;
      try { if (history.state && history.state.etabliModal) history.back(); } catch (e) {}
    }
  }, [modal]);
  useEffect(() => {
    const onPop = () => { if (modalInHistory.current) { modalInHistory.current = false; setModal(null); } };
    window.addEventListener("popstate", onPop);
    return () => window.removeEventListener("popstate", onPop);
  }, []);
  const confirmDiscard = (what) =>
    !dirty || window.confirm("Le devis en cours n'est pas enregistré. " + what + " quand même ? Ses modifications seront perdues.");
  const delLine = (id) =>
    setDevis((d) => ({ ...d, lines: d.lines.filter((l) => l.id !== id) }));
  const moveLine = (id, dir) =>
    setDevis((d) => {
      const i = d.lines.findIndex((l) => l.id === id);
      const j = i + dir;
      if (i < 0 || j < 0 || j >= d.lines.length) return d;
      const arr = [...d.lines];
      [arr[i], arr[j]] = [arr[j], arr[i]];
      return { ...d, lines: arr };
    });

  const saveQuote = () => {
    // Un devis sans id est un devis hérité (chargé avant cette version) : on lui
    // en attribue un à l'enregistrement pour qu'il ait une identité stable.
    const withId = devis.id ? devis : { ...devis, id: newQuoteId() };
    if (!devis.id) setDevis(withId);
    savedSnap.current = JSON.stringify(withId);
    const stamped = { ...withId, _savedAt: new Date().toISOString() };
    commitQuotes((list) => upsertQuote(list, stamped));
    // la fiche du client se met à jour toute seule (seuls les champs remplis la complètent)
    const fiche = clientFromQuote(stamped);
    if (fiche) commitClients((list) => upsertClient(list, fiche));
    flash("Devis enregistré : " + devis.numero);
  };
  const loadQuote = (q) => {
    if (!confirmDiscard("Ouvrir un autre devis")) return;
    const copy = JSON.parse(JSON.stringify(q));
    savedSnap.current = JSON.stringify(copy);
    setDevis(copy);
    setModal(null);
    setView("atelier");
    flash("Devis chargé : " + q.numero);
  };
  const deleteQuote = (id) => commitQuotes((list) => removeQuote(list, id));
  const resetQuote = () => {
    if (!confirmDiscard("Commencer un nouveau devis")) return;
    const fresh = newDevis(company, params, saved);
    savedSnap.current = JSON.stringify(fresh);
    setDevis(fresh);
    setModal(null);
    flash("Nouveau devis");
  };

  /* ---------- fiches clients ---------- */
  // Remplit le client du devis en cours depuis une fiche.
  const pickClient = (c) =>
    setDevis((d) => ({
      ...d,
      client: { ...d.client, nom: c.nom || "", adresse: c.adresse || "", email: c.email || "", tel: c.tel || "" },
      clientType: c.clientType === "pro" ? "pro" : "particulier",
    }));
  // Nouveau devis pour ce client (coordonnées pré-remplies).
  const newQuoteForClient = (c) => {
    if (!confirmDiscard("Commencer un nouveau devis")) return;
    const fresh = newDevis(company, params, saved);
    savedSnap.current = JSON.stringify(fresh);
    setDevis({
      ...fresh,
      client: { nom: c.nom || "", adresse: c.adresse || "", email: c.email || "", tel: c.tel || "" },
      clientType: c.clientType === "pro" ? "pro" : "particulier",
    });
    setModal(null);
    setView("atelier");
    flash("Nouveau devis pour " + c.nom);
  };
  const saveClientCard = (c) => commitClients((list) => (c.id ? replaceClient(list, c) : upsertClient(list, { ...c, id: newClientId() })));
  const deleteClientCard = (id) => commitClients((list) => removeClient(list, id));

  /* ---------- catalogue de fournitures réutilisables ---------- */
  // Enregistre une ligne fourniture dans le catalogue (dédoublonné par désignation).
  const addLineToCatalog = (line) => {
    const item = catalogItemFromLine(line);
    if (!item) { flash("Donne d'abord une désignation à la fourniture"); return; }
    setCatalog((list) => {
      const next = upsertCatalogItem(list, item);
      persistCatalog(next);
      return next;
    });
    flash("Ajouté au catalogue : " + item.designation);
  };
  // Remplit une ligne existante depuis un article du catalogue (auto-complétion).
  const applyCatalogToLine = (lineId, item) =>
    setDevis((d) => ({
      ...d,
      lines: d.lines.map((l) => (l.id === lineId ? applyCatalogItemToLine(l, item) : l)),
    }));
  // Insère une NOUVELLE ligne fourniture pré-remplie depuis le catalogue.
  const insertCatalogItem = (item) => {
    setDevis((d) => ({
      ...d,
      lines: [...d.lines, applyCatalogItemToLine(newLine("fourniture", params), item)],
    }));
    setModal(null);
    setView("atelier");
    flash("Fourniture ajoutée : " + item.designation);
  };
  const deleteCatalogItem = (id) =>
    setCatalog((list) => {
      const next = removeCatalogItem(list, id);
      persistCatalog(next);
      return next;
    });

  /* ---------- sauvegarde / restauration de TOUTES les données ---------- */
  // Télécharge un .json regroupant réglages + devis + calepinage + catalogue.
  const downloadJSON = (obj, filename) => {
    const blob = new Blob([JSON.stringify(obj, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 0);
  };
  const exportAll = () => {
    const bundle = buildBackup(
      { settings: { company, params }, quotes: saved, calepinage: calep, catalogue: catalog, clients },
      { exportedAt: new Date().toISOString() }
    );
    downloadJSON(bundle, "etabli-sauvegarde-" + todayISO() + ".json");
    flash("Sauvegarde téléchargée (" + saved.length + " devis)");
  };

  /* ---------- export / import d'UN SEUL devis (additif) ---------- */
  // Télécharge un devis (celui d'une ligne de « Mes devis », ou le devis en cours).
  const exportQuote = (q) => {
    downloadJSON(buildQuoteExport(q, { exportedAt: new Date().toISOString() }), quoteFileName(q, todayISO()));
    flash("Devis exporté : " + (q.numero || "sans numéro"));
  };
  // AJOUTE le devis du fichier à « Mes devis » : n'écrase rien, ne touche ni au devis
  // en cours, ni aux réglages, ni au catalogue (voir addImportedQuote dans le noyau).
  // Importe un devis depuis du TEXTE : fichier lu, ou réponse d'IA collée telle quelle.
  // Rend true si un devis a été ajouté.
  const importQuoteText = (text) => {
    setImportNotice(null);
    setImportTodo(null);
    {
      let read;
      try {
        read = readQuoteExportDetailed(String(text));
      } catch (e) {
        const msg = e && e.message ? e.message : "fichier invalide";
        // Avis persistant (les erreurs sont longues) + texte prêt à coller à l'IA.
        setImportNotice({ level: "error", title: "Import refusé", body: msg, feedback: quoteFeedbackPrompt(msg) });
        flash("Import refusé — voir le détail dans « Mes devis »", 3500);
        return;
      }
      const incoming = read.quote;
      const notice = read.warnings.length
        ? { level: "info", title: "Devis importé — remarques", body: read.warnings.map((w) => "• " + w).join("\n") }
        : null;
      const res = addImportedQuote(savedRef.current, { ...incoming, _savedAt: new Date().toISOString() });
      const label = incoming.numero || "sans numéro";
      if (res.status === "duplicate") {
        flash("Ce devis est déjà dans « Mes devis » (" + label + ") — rien n'a été ajouté", 4500);
        return;
      }
      commitQuotes(() => res.list);
      setImportNotice(notice);
      setImportTodo(read.todo && read.todo.length ? read.todo : null);
      if (res.status === "copy") {
        flash("Importé comme copie : un devis de même identifiant mais de contenu différent existe déjà (" + label + ")", 6000);
      } else if (res.numeroClash) {
        flash("Devis importé : " + label + " — attention, un autre devis porte déjà ce numéro", 6000);
      } else {
        flash("Devis importé : " + label);
      }
      return true;
    }
  };
  const importQuote = (file) => {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => importQuoteText(String(reader.result));
    reader.onerror = () => flash("Échec de lecture du fichier");
    reader.readAsText(file);
  };
  // Copie le devis « prêt pour l'IA » (consignes + schéma + données) pour le coller dans une conversation.
  const copyQuoteForAI = async (q) => {
    const text = JSON.stringify(buildQuoteExport(q, { exportedAt: new Date().toISOString() }), null, 2);
    try {
      await navigator.clipboard.writeText(text);
      flash("Devis copié avec ses consignes : collez-le dans la conversation avec l'IA, puis décrivez ce que vous voulez", 5000);
    } catch (e) {
      flash("Copie impossible : utilisez « Exporter le devis en cours » (fichier)", 4000);
    }
  };
  // Copie le message d'erreur prêt à coller à l'IA (boucle « valider → renvoyer les erreurs »).
  const copyFeedback = async (text) => {
    try {
      await navigator.clipboard.writeText(text);
      flash("Copié — colle-le dans la conversation avec l'IA");
    } catch (e) {
      flash("Copie impossible : sélectionne le texte du cadre puis Ctrl+C", 4000);
    }
  };
  // Réimporte une sauvegarde : réglages/calepinage remplacés, devis FUSIONNÉS
  // par id (rien n'est supprimé). Tolère les sections absentes.
  const importAll = (file) => {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      let restored;
      try {
        restored = readBackup(String(reader.result));
      } catch (e) {
        flash("Échec : " + (e && e.message ? e.message : "fichier invalide"));
        return;
      }
      if (restored.settings) {
        const c = { ...company, ...(restored.settings.company || {}) };
        const p = { ...params, ...(restored.settings.params || {}) };
        setCompany(c);
        setParams(p);
        persistSettings(c, p);
      }
      commitQuotes((list) => mergeQuotes(list, restored.quotes));
      if (restored.catalogue && restored.catalogue.length) {
        setCatalog((list) => {
          const next = mergeCatalog(list, restored.catalogue);
          persistCatalog(next);
          return next;
        });
      }
      if (restored.clients && restored.clients.length) commitClients((list) => mergeClients(list, restored.clients));
      if (restored.calepinage) setCalep(migrateCalep(restored.calepinage));
      setModal(null);
      flash("Sauvegarde restaurée (" + restored.quotes.length + " devis dans le fichier)");
    };
    reader.onerror = () => flash("Échec de lecture du fichier");
    reader.readAsText(file);
  };

  const doPrint = () => {
    setView("client");
    setTimeout(() => window.print(), 350);
  };

  /* ---------- calepinage → devis ---------- */
  // Adds one or several "fourniture" lines (one per calepiné material): N whole
  // panels at the per-panel cost, with the cut list folded into the metré detail.
  const addCalepToDevis = (lineOrLines) => {
    const lines = Array.isArray(lineOrLines) ? lineOrLines : [lineOrLines];
    if (!lines.length) return;
    setDevis((d) => ({ ...d, lines: [...d.lines, ...lines] }));
    setModal(null);
    setView("atelier");
    flash(lines.length > 1 ? `${lines.length} lignes ajoutées au devis` : "Calepinage ajouté au devis");
  };

  /* ============================ RENDER ============================ */
  return (
    <div className="app">
      <style>{CSS}</style>

      {/* top bar */}
      <header className="bar no-print">
        <div className="brand">
          <div className="brand-mark">▟▙</div>
          <div>
            <div className="brand-name">ÉTABLI</div>
            <div className="brand-sub">devis de menuiserie · atelier &amp; client</div>
          </div>
        </div>

        <div className="flip" role="tablist" aria-label="Vue">
          <button
            className={"flip-btn" + (view === "atelier" ? " on" : "")}
            onClick={() => setView("atelier")}
          >
            Atelier
          </button>
          <button
            className={"flip-btn" + (view === "client" ? " on" : "")}
            onClick={() => setView("client")}
          >
            Devis client
          </button>
        </div>

        <div className="bar-actions">
          <button className="btn ghost" onClick={() => { setImportNotice(null); setImportTodo(null); setModal("mesdevis"); }}>
            Mes devis {saved.length ? `(${saved.length})` : ""}
          </button>
          <button className="btn ghost" onClick={resetQuote}>
            Nouveau
          </button>
          <button className="btn ghost" onClick={() => setModal("clients")}>
            Clients {clients.length ? `(${clients.length})` : ""}
          </button>
          <button className="btn ghost" onClick={() => setModal("catalogue")}>
            Catalogue {catalog.length ? `(${catalog.length})` : ""}
          </button>
          <button className="btn ghost" onClick={() => setModal("calepinage")}>
            Calepinage
          </button>
          <button className="btn ghost" onClick={() => setModal("reglages")}>
            Réglages
          </button>
          <button className={"btn" + (dirty ? " btn-dirty" : "")} onClick={saveQuote} title={dirty ? "Modifications non enregistrées" : "Devis enregistré"}>
            Enregistrer{dirty ? " •" : ""}
          </button>
          {installable ? (
            <button className="btn ghost" onClick={installApp} title="Installer ÉTABLI sur cet appareil">
              Installer
            </button>
          ) : null}
          {serverMode && me ? (
            <>
              <span className="bar-user" title="Compte connecté">{me.login}</span>
              <button className="btn ghost" onClick={onLogout}>
                Déconnexion
              </button>
            </>
          ) : null}
        </div>
      </header>

      {syncError ? (
        <div className="syncbar no-print" role="alert">
          <strong>⚠ {syncError.fatal ? "Chargement impossible" : "Non enregistré"} :</strong> {syncError.message}{" "}
          {syncError.fatal || syncError.kind === "conflict" ? (
            <button className="btn sm" onClick={() => window.location.reload()}>Recharger la page</button>
          ) : syncError.kind === "network" ? (
            <span>Vos modifications restent à l'écran : cliquez de nouveau sur « Enregistrer » quand la connexion est revenue.</span>
          ) : null}
        </div>
      ) : null}

      {!isStandalone() && !installHintSeen ? (
        <div className="ihint no-print" role="note">
          <span>📲 Installez ÉTABLI sur l'écran d'accueil : icône, plein écran, ouverture même sans réseau.</span>
          <button className="btn sm" onClick={() => { dismissInstallHint(); setModal("installer"); }}>Comment ?</button>
          <button className="ico" aria-label="Masquer ce conseil" onClick={dismissInstallHint}>✕</button>
        </div>
      ) : null}
      {view === "atelier" ? (
        <Atelier
          devis={devis}
          setDevis={setDevis}
          params={params}
          calc={calc}
          setLine={setLine}
          addLine={addLine}
          delLine={delLine}
          moveLine={moveLine}
          margeColor={margeColor}
          catalog={catalog}
          clients={clients}
          onPickClient={pickClient}
          onOpenClients={() => setModal("clients")}
          onApplyCatalogItem={applyCatalogToLine}
          onAddToCatalog={addLineToCatalog}
          onOpenCatalogue={() => setModal("catalogue")}
        />
      ) : (
        <ClientSheet
          devis={devis}
          company={company}
          calc={calc}
          onPrint={doPrint}
        />
      )}

      {/* ---------- modals ---------- */}
      {modal === "calepinage" && (
        <Modal title="Calepinage — débit de panneaux" onClose={() => setModal(null)} wide>
          <Calepinage
            calep={calep}
            setCalep={setCalep}
            params={params}
            onAddToDevis={addCalepToDevis}
            flash={flash}
          />
        </Modal>
      )}
      {modal === "clients" && (
        <Modal title="Clients" onClose={() => setModal(null)} wide>
          <Clients
            clients={clients}
            quotes={saved}
            onNewQuote={newQuoteForClient}
            onSave={saveClientCard}
            onDelete={deleteClientCard}
            onLoadQuote={loadQuote}
          />
        </Modal>
      )}
      {modal === "installer" && (
        <Modal title="Installer ÉTABLI" onClose={() => setModal(null)}>
          <InstallHelp installable={installable} onInstall={installApp} serverMode={serverMode} />
        </Modal>
      )}
      {modal === "catalogue" && (
        <Modal title="Catalogue de fournitures" onClose={() => setModal(null)} wide>
          <Catalogue
            catalog={catalog}
            onInsert={insertCatalogItem}
            onDelete={deleteCatalogItem}
          />
        </Modal>
      )}
      {modal === "migration" && serverMode && me && me.legacyUrl && (
        <Modal title="Récupérer mes données de l'ancienne adresse" onClose={() => setModal(null)}>
          <MigrationModal
            legacyUrl={me.legacyUrl}
            store={store}
            onImported={async () => {
              // le serveur a ajouté ce qui manquait : on recharge tout depuis le serveur
              try { applyData(await store.loadAll()); } catch (e) { setSyncError({ kind: (e && e.kind) || "network", message: (e && e.message) || "Rechargement impossible." }); }
            }}
            onSkip={async () => { await store.skipMigration(); setModal(null); flash("D'accord, rien à récupérer"); }}
            onClose={() => setModal(null)}
          />
        </Modal>
      )}
      {modal === "reglages" && (
        <Modal title="Réglages" onClose={() => setModal(null)} wide>
          <Reglages
            onMigrate={serverMode && me && me.legacyUrl ? () => setModal("migration") : null}
            onChangePassword={serverMode ? (cur, nxt) => store.changePassword(cur, nxt) : null}
            installHelp={<InstallHelp installable={installable} onInstall={installApp} serverMode={serverMode} />}
            account={serverMode && me ? me.login : null}
            company={company}
            params={params}
            quoteCount={saved.length}
            onExport={exportAll}
            onImport={importAll}
            onSave={(c, p) => {
              setCompany(c);
              setParams(p);
              persistSettings(c, p);
              setModal(null);
              flash("Réglages enregistrés");
            }}
          />
        </Modal>
      )}
      {modal === "mesdevis" && (
        <Modal title="Mes devis" onClose={() => setModal(null)}>
          <MesDevis
            saved={saved}
            onLoad={loadQuote}
            onDelete={deleteQuote}
            onExport={exportQuote}
            onExportCurrent={() => exportQuote(devis)}
            onImport={importQuote}
            onImportText={importQuoteText}
            onCopyCurrentForAI={() => copyQuoteForAI(devis)}
            todo={importTodo}
            onDismissTodo={() => setImportTodo(null)}
            onCopyTodo={() => copyFeedback(quoteTodoPrompt(importTodo))}
            notice={importNotice}
            onDismissNotice={() => setImportNotice(null)}
            onCopyFeedback={copyFeedback}
          />
        </Modal>
      )}

      <nav className="mbar no-print" aria-label="Actions rapides">
        <div className="mbar-sum" onClick={() => { const el = document.querySelector(view === "atelier" ? ".summary" : ".s-totals"); if (el) el.scrollIntoView({ behavior: "smooth", block: "center" }); }}>
          <span className="mbar-lab">Total {calc.coco ? "HTVA" : "TVAC"}</span>
          <span className="mbar-val mono">{eur(calc.ttc)}</span>
          {view === "atelier" ? (
            <span className="mbar-marge mono" style={{ color: margeColor(calc.margePct) }}>marge {pct(calc.margePct)}</span>
          ) : null}
        </div>
        <button className={"btn mbar-save" + (dirty ? " btn-dirty" : "")} onClick={saveQuote}>
          {dirty ? "Enregistrer •" : "Enregistré ✓"}
        </button>
      </nav>

      {toast ? <div className="toast no-print">{toast}</div> : null}
    </div>
  );
}

/* =========================================================================
   ATELIER (back-office)
   ========================================================================= */
function Atelier({
  devis,
  setDevis,
  params,
  calc,
  setLine,
  addLine,
  delLine,
  moveLine,
  margeColor,
  catalog,
  clients,
  onPickClient,
  onOpenClients,
  onApplyCatalogItem,
  onAddToCatalog,
  onOpenCatalogue,
}) {
  const set = (patch) => setDevis((d) => ({ ...d, ...patch }));
  const [clientAc, setClientAc] = useState(false);
  const clientSuggestions = clientAc ? searchClients(clients || [], devis.client.nom, 6) : [];
  const setClient = (patch) =>
    setDevis((d) => ({ ...d, client: { ...d.client, ...patch } }));

  // Taux qu'une fourniture applique faute d'override de ligne : la « TVA
  // fournitures » du devis si elle est définie, sinon le taux principal.
  const tvaApplies = devis.clientType === "particulier";
  const fournDefaultRate =
    devis.tvaFournitures === "" || devis.tvaFournitures == null
      ? num(devis.tvaRate)
      : num(devis.tvaFournitures);

  return (
    <main className="wrap no-print">
      {/* meta + client */}
      <section className="card">
        <div className="card-eyebrow">01 — Chantier &amp; client</div>
        <div className="grid">
          <Field label="N° de devis">
            <TextIn value={devis.numero} onChange={(v) => set({ numero: v })} mono />
          </Field>
          <Field label="Date">
            <TextIn value={devis.dateISO} onChange={(v) => set({ dateISO: v })} mono />
          </Field>
          <Field label="Validité (jours)">
            <NumIn value={devis.validite} onChange={(v) => set({ validite: v })} suffix="j" />
          </Field>
          <Field label="Client" hint={clients && clients.length ? "tapez pour retrouver une fiche client" : undefined}>
            <span className="client-ac-wrap">
              <input
                className="in"
                type="text"
                value={devis.client.nom ?? ""}
                placeholder="Nom / société"
                autoComplete="off"
                onChange={(e) => setClient({ nom: e.target.value })}
                onFocus={() => setClientAc(true)}
                onBlur={() => setClientAc(false)}
              />
              {clientSuggestions.length > 0 && (
                <ul className="ac client-ac" role="listbox" aria-label="Fiches clients">
                  {clientSuggestions.map((c) => (
                    <li key={c.id}>
                      <button
                        type="button"
                        className="ac-item"
                        // onMouseDown (avant le blur) : applique la fiche sans fermer la liste trop tôt
                        onMouseDown={(e) => { e.preventDefault(); onPickClient(c); setClientAc(false); }}
                      >
                        <span className="ac-desig">{c.nom}</span>
                        <span className="ac-meta">{[c.adresse, c.tel, c.email].filter(Boolean).join(" · ") || "—"}{c.clientType === "pro" ? " · pro" : ""}</span>
                      </button>
                    </li>
                  ))}
                </ul>
              )}
            </span>
          </Field>
          <Field label="Téléphone">
            <TextIn value={devis.client.tel} onChange={(v) => setClient({ tel: v })} />
          </Field>
          <Field label="E-mail">
            <TextIn value={devis.client.email} onChange={(v) => setClient({ email: v })} />
          </Field>
          <Field label="Adresse du chantier" wide>
            <TextIn
              value={devis.client.adresse}
              onChange={(v) => setClient({ adresse: v })}
            />
          </Field>
          <RichField label="Description du chantier" wide>
            <RichArea
              value={devis.chantier}
              onChange={(v) => set({ chantier: v })}
              placeholder="Ex. fabrication et pose d'un dressing sur mesure"
            />
          </RichField>
        </div>
      </section>

      {/* lines */}
      <section className="card">
        <div className="card-eyebrow">02 — Bordereau &amp; métré</div>
        <p className="muted tip">
          Tout ce que tu encodes ici reste à l'atelier. Le client ne verra ni le
          coût d'achat, ni le coût horaire, ni la marge — seulement la désignation,
          la quantité et le prix de vente.
        </p>

        {devis.lines.length === 0 && (
          <div className="empty">
            Aucune ligne. Ajoute une fourniture, de la main-d'œuvre ou un forfait
            ci-dessous.
          </div>
        )}

        <div className="lines">
          {calc.rows.map((l, i) => (
            <LineCard
              key={l.id}
              line={l}
              index={i}
              last={i === devis.lines.length - 1}
              setLine={setLine}
              delLine={delLine}
              moveLine={moveLine}
              margeColor={margeColor}
              tvaApplies={tvaApplies}
              fournDefaultRate={fournDefaultRate}
              catalog={catalog}
              onApplyCatalogItem={onApplyCatalogItem}
              onAddToCatalog={onAddToCatalog}
            />
          ))}
        </div>

        <div className="add-row">
          <button className="btn add" onClick={() => addLine("fourniture")}>
            + Fourniture
          </button>
          <button className="btn add" onClick={() => addLine("main")}>
            + Main-d'œuvre
          </button>
          <button className="btn add" onClick={() => addLine("forfait")}>
            + Forfait / sous-traitance
          </button>
          <button className="btn add add-cat" onClick={onOpenCatalogue} title="Piocher une fourniture déjà encodée">
            ↳ depuis le catalogue{catalog && catalog.length ? ` (${catalog.length})` : ""}
          </button>
        </div>
      </section>

      {/* adjustments */}
      <section className="card">
        <div className="card-eyebrow">03 — Ajustements</div>
        <div className="grid">
          <Field label="Remise">
            <div className="remise">
              <select
                className="in in-sel"
                value={devis.remiseType}
                onChange={(e) => set({ remiseType: e.target.value })}
              >
                <option value="eur">€</option>
                <option value="pct">%</option>
              </select>
              <NumIn value={devis.remiseVal} onChange={(v) => set({ remiseVal: v })} />
            </div>
          </Field>
          <Field label="Déplacement — prix client" hint="HTVA, visible sur le devis">
            <NumIn value={devis.deplacement} onChange={(v) => set({ deplacement: v })} suffix="€" />
          </Field>
          <Field label="Déplacement — coût réel" hint="atelier uniquement">
            <NumIn
              value={devis.deplacementCout}
              onChange={(v) => set({ deplacementCout: v })}
              suffix="€"
            />
          </Field>
          <Field label="Type de client">
            <select
              className="in in-sel"
              value={devis.clientType}
              onChange={(e) => set({ clientType: e.target.value })}
            >
              <option value="particulier">Particulier (TVA appliquée)</option>
              <option value="pro">Professionnel (cocontractant)</option>
            </select>
          </Field>
          {devis.clientType === "particulier" && (
            <Field label="Taux de TVA" hint="taux principal — main-d'œuvre, forfaits, déplacement">
              <select
                className="in in-sel"
                value={devis.tvaRate}
                onChange={(e) => set({ tvaRate: Number(e.target.value) })}
              >
                {TVA_OPTIONS.map((o) => (
                  <option key={o.v} value={o.v}>
                    {o.label}
                  </option>
                ))}
              </select>
            </Field>
          )}
          {devis.clientType === "particulier" && (
            <Field label="TVA fournitures" hint="vide = même taux que ci-dessus (ex. 21 % matériel, 6 % chantier)">
              <select
                className="in in-sel"
                value={devis.tvaFournitures ?? ""}
                onChange={(e) =>
                  set({ tvaFournitures: e.target.value === "" ? "" : Number(e.target.value) })
                }
              >
                <option value="">Même taux ({num(devis.tvaRate)} %)</option>
                {TVA_OPTIONS.map((o) => (
                  <option key={o.v} value={o.v}>
                    {o.label}
                  </option>
                ))}
              </select>
            </Field>
          )}
          <Field label="Acompte à la commande">
            <NumIn value={devis.acompte} onChange={(v) => set({ acompte: v })} suffix="%" />
          </Field>
          <RichField label="Conditions (bas de devis)" wide>
            <RichArea value={devis.conditions} onChange={(v) => set({ conditions: v })} rows={3} />
          </RichField>
        </div>
      </section>

      {/* atelier summary */}
      <section className="card summary">
        <div className="card-eyebrow">04 — Vue atelier</div>
        <div className="sum-grid">
          <Stat label="Coût de revient" value={eur(calc.coutTotal)} muted />
          <Stat label="Vente HTVA" value={eur(calc.baseHT)} />
          <Stat
            label="Marge"
            value={eur(calc.marge)}
            sub={pct(calc.margePct)}
            color={margeColor(calc.margePct)}
            big
          />
          <Stat label="Bénéfice estimé" value={eur(calc.marge)} color={margeColor(calc.margePct)} />
        </div>
        <div className="margebar">
          <div
            className="margebar-fill"
            style={{
              width: Math.min(100, Math.max(2, calc.margePct)) + "%",
              background: margeColor(calc.margePct),
            }}
          />
          <span className="margebar-lab">
            Marge {pct(calc.margePct)} · cible {pct(num(params.margeCible))}
          </span>
        </div>

        <div className="sum-tot">
          <Row k="Total HTVA" v={eur(calc.baseHT)} />
          {calc.coco ? (
            <Row k="TVA — autoliquidation (0 %)" v={eur(0)} />
          ) : (
            calc.tvaGroups.map((g) => (
              <Row
                key={g.rate}
                k={calc.tvaMixed ? `TVA ${g.rate} % (sur ${eur(g.base)})` : `TVA ${g.rate} %`}
                v={eur(g.tva)}
              />
            ))
          )}
          <Row k="Total TVAC" v={eur(calc.ttc)} strong />
          <Row k={`Acompte (${num(devis.acompte)} %)`} v={eur(calc.acompte)} />
        </div>
      </section>
    </main>
  );
}

function Stat({ label, value, sub, color, big, muted }) {
  return (
    <div className={"stat" + (big ? " stat-big" : "")}>
      <div className="stat-lab">{label}</div>
      <div className="stat-val" style={{ color: color || (muted ? "var(--ink-3)" : "var(--ink)") }}>
        {value}
      </div>
      {sub ? <div className="stat-sub" style={{ color }}>{sub}</div> : null}
    </div>
  );
}
function Row({ k, v, strong }) {
  return (
    <div className={"trow" + (strong ? " trow-strong" : "")}>
      <span>{k}</span>
      <span className="mono">{v}</span>
    </div>
  );
}

/* ---------- single line card ---------- */
function LineCard({ line, index, last, setLine, delLine, moveLine, margeColor, tvaApplies, fournDefaultRate, catalog, onApplyCatalogItem, onAddToCatalog }) {
  const l = line;
  const [acOpen, setAcOpen] = useState(false);
  const typeLabel =
    l.type === "main" ? "Main-d'œuvre" : l.type === "forfait" ? "Forfait" : "Fourniture";
  const isFourn = l.type === "fourniture";

  // Mètre linéaire : la quantité découle de la liste de longueurs (noyau).
  const isMl = isFourn && !!l.mlOn;
  const lin = linearLineQty(l);
  const items = l.mlItems || [];
  const setMlItem = (id, patch) =>
    setLine(l.id, { mlItems: items.map((it) => (it.id === id ? { ...it, ...patch } : it)) });
  const addMlItem = () => setLine(l.id, { mlItems: [...items, { id: uid(), len: "", qty: "1" }] });
  const delMlItem = (id) => setLine(l.id, { mlItems: items.filter((it) => it.id !== id) });
  const toggleMl = (on) => {
    if (on) {
      // première activation : une ligne de longueur prête à remplir ; l'unité
      // passe à « ml » pour que le catalogue / la feuille client restent cohérents.
      setLine(l.id, { mlOn: true, unite: "ml", mlItems: items.length ? items : [{ id: uid(), len: "", qty: "1" }] });
    } else {
      // on garde la quantité calculée comme valeur saisie (pas de saut à l'ancienne).
      setLine(l.id, { mlOn: false, qte: String(lin.qteM).replace(".", ",") });
    }
  };
  const fillDetail = () => setLine(l.id, { detail: linearDetailText(l), showDetail: true });

  // Auto-complétion depuis le catalogue (fournitures uniquement).
  const suggestions = isFourn && acOpen ? searchCatalog(catalog || [], l.designation, 6) : [];
  return (
    <div className="line">
      <div className="line-head">
        <span className={"chip chip-" + l.type}>{typeLabel}</span>
        <div className="line-title-wrap">
          <input
            className="in line-title"
            type="text"
            placeholder="Désignation (ex. plateau chêne massif 40 mm)"
            value={l.designation ?? ""}
            onChange={(e) => setLine(l.id, { designation: e.target.value })}
            onFocus={() => setAcOpen(true)}
            onBlur={() => setAcOpen(false)}
            autoComplete="off"
          />
          {suggestions.length > 0 && (
            <ul className="ac">
              {suggestions.map((it) => (
                <li key={it.id}>
                  <button
                    type="button"
                    className="ac-item"
                    // onMouseDown (avant le blur) pour appliquer sans fermer trop tôt.
                    onMouseDown={(e) => {
                      e.preventDefault();
                      onApplyCatalogItem(l.id, it);
                      setAcOpen(false);
                    }}
                  >
                    <span className="ac-desig">{it.designation}</span>
                    <span className="ac-meta">
                      {eur(num(it.pa))}/{it.unite || "u"} · marge {num(it.marge)} %
                    </span>
                  </button>
                </li>
              ))}
            </ul>
          )}
        </div>
        <div className="line-ord">
          {isFourn && (
            <button
              className="ico ico-cat"
              title="Ajouter cette fourniture au catalogue"
              onClick={() => onAddToCatalog(l)}
            >
              ☆
            </button>
          )}
          <button className="ico" title="Monter" disabled={index === 0} onClick={() => moveLine(l.id, -1)}>
            ↑
          </button>
          <button className="ico" title="Descendre" disabled={last} onClick={() => moveLine(l.id, 1)}>
            ↓
          </button>
          <button className="ico ico-del" title="Supprimer" onClick={() => delLine(l.id)}>
            ✕
          </button>
        </div>
      </div>

      <div className="line-body">
        {l.type === "fourniture" && (
          <>
            <Field label="Quantité (métré)" hint={isMl ? "calculée ci-dessous" : undefined}>
              {isMl ? (
                <NumIn value={String(lin.qteM).replace(".", ",")} onChange={() => {}} suffix="ml" readOnly />
              ) : (
                <NumIn value={l.qte} onChange={(v) => setLine(l.id, { qte: v })} />
              )}
            </Field>
            <Field label="Unité">
              {isMl ? (
                <TextIn value="ml" onChange={() => {}} readOnly />
              ) : (
                <TextIn value={l.unite} onChange={(v) => setLine(l.id, { unite: v })} placeholder="m², ml, pce…" />
              )}
            </Field>
            <Field label={isMl ? "Prix d'achat / ml" : "Prix d'achat / u"} hint="HTVA — atelier">
              <NumIn value={l.pa} onChange={(v) => setLine(l.id, { pa: v })} suffix="€" />
            </Field>
            <Field label="Marge">
              <NumIn value={l.marge} onChange={(v) => setLine(l.id, { marge: v })} suffix="%" />
            </Field>
            {tvaApplies && (
              <Field label="TVA de cette ligne" hint="vide = taux fournitures du devis">
                <select
                  className="in in-sel"
                  value={l.tvaRate ?? ""}
                  onChange={(e) =>
                    setLine(l.id, { tvaRate: e.target.value === "" ? "" : Number(e.target.value) })
                  }
                >
                  <option value="">Défaut ({num(fournDefaultRate)} %)</option>
                  {TVA_OPTIONS.map((o) => (
                    <option key={o.v} value={o.v}>
                      {o.v} %
                    </option>
                  ))}
                </select>
              </Field>
            )}
          </>
        )}
        {l.type === "main" && (
          <>
            <Field label="Heures">
              <NumIn value={l.heures} onChange={(v) => setLine(l.id, { heures: v })} suffix="h" />
            </Field>
            <Field label="Taux facturé / h" hint="prix client">
              <NumIn value={l.tauxVente} onChange={(v) => setLine(l.id, { tauxVente: v })} suffix="€" />
            </Field>
            <Field label="Coût horaire / h" hint="atelier">
              <NumIn value={l.coutHoraire} onChange={(v) => setLine(l.id, { coutHoraire: v })} suffix="€" />
            </Field>
          </>
        )}
        {l.type === "forfait" && (
          <>
            <Field label="Coût / achat" hint="HTVA — atelier">
              <NumIn value={l.pa} onChange={(v) => setLine(l.id, { pa: v })} suffix="€" />
            </Field>
            <Field label="Marge">
              <NumIn value={l.marge} onChange={(v) => setLine(l.id, { marge: v })} suffix="%" />
            </Field>
          </>
        )}
      </div>

      {/* mètre linéaire : liste de longueurs → quantité en ml */}
      {isFourn && (
        <div className="ml">
          <label className="tog ml-toggle">
            <input type="checkbox" checked={isMl} onChange={(e) => toggleMl(e.target.checked)} />
            Calculer au mètre linéaire <span className="muted">(baguettes, profilés, plinthes…)</span>
          </label>
          {isMl && (
            <div className="ml-box">
              <div className="ml-head">
                <span>Longueurs en</span>
                <select
                  className="in in-sel ml-unit"
                  aria-label="Unité des longueurs"
                  value={l.mlUnit || "m"}
                  onChange={(e) => setLine(l.id, { mlUnit: e.target.value })}
                >
                  <option value="m">m</option>
                  <option value="cm">cm</option>
                  <option value="mm">mm</option>
                </select>
                <span className="ml-head-qty">× quantité</span>
              </div>
              {(l.mlItems || []).map((it) => (
                <div className="ml-row" key={it.id}>
                  <input
                    className="in in-mono in-num"
                    inputMode="decimal"
                    aria-label="Longueur"
                    placeholder="0"
                    value={it.len}
                    onChange={(e) => setMlItem(it.id, { len: e.target.value })}
                  />
                  <input
                    className="in in-mono in-num"
                    inputMode="numeric"
                    aria-label="Quantité de cette longueur"
                    placeholder="1"
                    value={it.qty}
                    onChange={(e) => setMlItem(it.id, { qty: e.target.value })}
                  />
                  <button className="ico ico-del" title="Supprimer cette longueur" onClick={() => delMlItem(it.id)}>✕</button>
                </div>
              ))}
              <div className="ml-foot">
                <button type="button" className="btn add sm" onClick={addMlItem}>+ Longueur</button>
                <label className="ml-perte">
                  <span>Chute / majoration</span>
                  <NumIn value={l.mlPerte} onChange={(v) => setLine(l.id, { mlPerte: v })} suffix="%" />
                </label>
              </div>
              <div className="ml-sum">
                <span>
                  {lin.pieces} pièce(s) · <b className="mono">{nf2(lin.totalM)} ml</b>
                  {lin.perte > 0 ? <> + {nf1(lin.perte)} % de chute</> : null}
                </span>
                <span className="ml-qte">
                  Quantité facturée <b className="mono">{nf2(lin.qteM)} ml</b>
                </span>
                <button type="button" className="btn add sm" onClick={fillDetail} disabled={lin.pieces === 0}>
                  → Détail au métré
                </button>
              </div>
            </div>
          )}
        </div>
      )}

      {/* per-line metré detail */}
      <div className="line-detail">
        <RichArea
          value={l.detail}
          onChange={(v) => setLine(l.id, { detail: v })}
          placeholder="Métré / détail (ex. 3,20 × 2,10 m — façade + 2 portes). Visible sur le devis seulement si la case est cochée."
        />
      </div>

      <div className="line-foot">
        <div className="toggles">
          <label className="tog">
            <input
              type="checkbox"
              checked={!!l.showQty}
              onChange={(e) => setLine(l.id, { showQty: e.target.checked })}
            />
            Détailler qté/PU sur le devis
          </label>
          <label className="tog">
            <input
              type="checkbox"
              checked={!!l.showDetail}
              onChange={(e) => setLine(l.id, { showDetail: e.target.checked })}
            />
            Afficher le métré sur le devis
          </label>
        </div>
        <div className="line-figs">
          <span className="fig">
            Coût <b className="mono">{eur(l.cout)}</b>
          </span>
          <span className="fig" style={{ color: margeColor(l.vente > 0 ? (l.margeEur / l.vente) * 100 : 0) }}>
            Marge <b className="mono">{eur(l.margeEur)}</b>
          </span>
          <span className="fig fig-sell">
            Vente HTVA <b className="mono">{eur(l.vente)}</b>
          </span>
        </div>
      </div>
    </div>
  );
}

/* =========================================================================
   MODAL Mes devis — liste + export / import d'un seul devis
   ========================================================================= */
function MesDevis({ saved, onLoad, onDelete, onExport, onExportCurrent, onImport, onImportText, onCopyCurrentForAI, todo, onDismissTodo, onCopyTodo, notice, onDismissNotice, onCopyFeedback }) {
  const fileRef = useRef(null);
  const [pasteOpen, setPasteOpen] = useState(false);
  const [pasted, setPasted] = useState("");
  return (
    <div>
      <div className="qtools">
        <button className="btn sm" onClick={() => fileRef.current && fileRef.current.click()}>
          Importer un devis…
        </button>
        <button className="btn sm add" onClick={onExportCurrent}>
          Exporter le devis en cours
        </button>
        <button className="btn sm add" onClick={onCopyCurrentForAI} title="Consignes + schéma + devis, à coller dans ChatGPT, Claude…">
          Copier pour une IA
        </button>
        <button className="btn sm add" onClick={() => setPasteOpen((o) => !o)} aria-expanded={pasteOpen}>
          Coller une réponse d'IA…
        </button>
        <input
          ref={fileRef}
          type="file"
          accept="application/json,.json,.txt,text/plain"
          className="devis-file"
          onChange={(e) => {
            const f = e.target.files && e.target.files[0];
            e.target.value = "";
            onImport(f);
          }}
        />
      </div>
      <p className="muted qtools-note">
        L'import <strong>ajoute</strong> le devis du fichier à cette liste : il n'écrase aucun
        devis existant et ne touche pas au devis en cours. Pour tout transférer d'un coup,
        utilise <em>Réglages → Sauvegarde des données</em>.
      </p>
      <p className="muted qtools-note">
        <strong>Avec une IA :</strong> le fichier exporté s'ouvre sur des consignes et un schéma.
        Joins-le à une conversation (ChatGPT, Claude…) pour faire modifier le devis ou en créer un
        nouveau, puis enregistre la réponse en <code>.json</code> (ou <code>.txt</code>) et importe-la.
        Si elle est refusée, copie les erreurs pour l'IA depuis le cadre ci-dessous.
      </p>
      {pasteOpen && (
        <div className="qpaste">
          <label className="fld-lab" htmlFor="qpaste-ta">Réponse de l'IA (JSON, bloc de code et texte autour acceptés)</label>
          <textarea
            id="qpaste-ta"
            className="in in-area qpaste-ta"
            rows={6}
            value={pasted}
            placeholder={'Collez ici la réponse complète : « Voici le devis… ```json { "app": "etabli", … } ``` »'}
            onChange={(e) => setPasted(e.target.value)}
          />
          <div className="qnotice-act">
            <button className="btn sm" disabled={!pasted.trim()} onClick={() => { if (onImportText(pasted)) { setPasted(""); setPasteOpen(false); } }}>
              Importer ce texte
            </button>
            <button className="btn sm ghost-dark" onClick={() => { setPasted(""); setPasteOpen(false); }}>Annuler</button>
          </div>
        </div>
      )}
      {todo && todo.length ? (
        <div className="qnotice qnotice-todo" role="status">
          <div className="qnotice-head">
            <strong>À compléter ({todo.length})</strong>
            <button className="ico" aria-label="Fermer la liste à compléter" onClick={onDismissTodo}>✕</button>
          </div>
          <p className="muted qtodo-note">Le devis est importé. Ces champs sont vides : complétez-les dans l'atelier, ou demandez-les à l'IA.</p>
          <pre className="qnotice-body">{todo.map((t) => "• " + t.path + " : " + t.message).join("\n")}</pre>
          <div className="qnotice-act">
            <button className="btn sm" onClick={onCopyTodo}>Copier pour l'IA</button>
            <span className="muted">Elle vous posera les questions, sans inventer de valeurs.</span>
          </div>
        </div>
      ) : null}
      {notice && (
        <div className={"qnotice qnotice-" + notice.level} role="alert">
          <div className="qnotice-head">
            <strong>{notice.title}</strong>
            <button className="ico" aria-label="Fermer ce message" onClick={onDismissNotice}>✕</button>
          </div>
          <pre className="qnotice-body">{notice.body}</pre>
          {notice.feedback ? (
            <div className="qnotice-act">
              <button className="btn sm" onClick={() => onCopyFeedback(notice.feedback)}>Copier pour l'IA</button>
              <span className="muted">Colle-le dans la conversation : l'IA corrigera le fichier.</span>
            </div>
          ) : null}
        </div>
      )}
      {saved.length === 0 ? (
        <p className="muted">
          Aucun devis enregistré pour l'instant. Clique sur « Enregistrer »
          pour garder un devis ici.
        </p>
      ) : (
        <ul className="qlist">
          {saved.map((q) => (
            <li key={q.id || q.numero} className="qrow">
              <div>
                <div className="qrow-num">{q.numero}</div>
                <div className="qrow-meta">
                  {q.client?.nom || "Client —"} · {frDate(q.dateISO)} ·{" "}
                  {q.lines?.length || 0} ligne(s)
                </div>
              </div>
              <div className="qrow-act">
                <button className="btn sm" onClick={() => onLoad(q)}>
                  Charger
                </button>
                <button className="btn sm add" title="Télécharger ce devis en .json" onClick={() => onExport(q)}>
                  Exporter
                </button>
                <button className="btn sm danger" onClick={() => onDelete(q.id || q.numero)}>
                  Suppr.
                </button>
              </div>
            </li>
          ))}
        </ul>
      )}
    </div>
  );
}

/* =========================================================================
   MODAL Clients — fiches réutilisables (coordonnées pré-remplies)
