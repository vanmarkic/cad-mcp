<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>ÉTABLI — migration de vos données</title>
<style>
  body{font-family:system-ui,sans-serif;background:#E7E2D8;color:#211D18;margin:0;padding:24px;line-height:1.5}
  main{max-width:460px;margin:0 auto;background:#FBFAF6;border:1px solid #D7CFBF;border-radius:12px;padding:20px 22px}
  h1{font-size:18px;margin:0 0 10px}
  code{background:#efeae0;padding:1px 6px;border-radius:4px;word-break:break-all}
  button{font:inherit;font-weight:600;border:0;border-radius:6px;padding:9px 16px;cursor:pointer;background:#A8631F;color:#fff;margin-right:8px}
  button.sec{background:transparent;color:#534B40;border:1px solid #D7CFBF}
  .muted{color:#8C8273;font-size:13px}
  .ok{color:#3D6B4A;font-weight:600}
  .err{color:#A23D2C;font-weight:600}
</style>
</head>
<body>
<main>
  <h1>Migration de vos données ÉTABLI</h1>
  <div id="msg" class="muted">En attente de la demande du nouveau serveur…</div>
  <div id="act" hidden>
    <p>Envoyer vos devis, votre catalogue et vos réglages enregistrés dans <strong>ce navigateur</strong> vers :</p>
    <p><code id="target"></code></p>
    <p class="muted">Rien n'est supprimé ici. Le serveur ajoute ce qui lui manque, sans rien écraser.</p>
    <button id="send">Envoyer mes données</button><button id="cancel" class="sec">Annuler</button>
  </div>
</main>
<script src="lib/etabli-core.js"></script>
<script src="migrate-config.js"></script>
<script>
/* Protocole (postMessage) entre le serveur ÉTABLI (fenêtre ouverte « opener ») et cette page :
     1. cette page → opener : { type:"etabli-migrate:ready" }          (sans donnée)
     2. opener → cette page : { type:"etabli-migrate:request" }
        → on vérifie event.origin ∈ ETABLI_MIGRATE_TARGETS, puis on DEMANDE CONFIRMATION à l'utilisateur
     3. clic sur « Envoyer » → { type:"etabli-migrate:data", backup } adressé UNIQUEMENT à cette origine.
   Les données ne partent jamais vers une origine absente de la liste, ni sans clic. */
(function () {
  "use strict";
  var KEYS = ["etabli:settings", "etabli:quotes", "etabli:calepinage", "etabli:catalogue"];
  var targets = Array.isArray(window.ETABLI_MIGRATE_TARGETS) ? window.ETABLI_MIGRATE_TARGETS : [];
  var msg = document.getElementById("msg"), act = document.getElementById("act");
  var pending = null; // { origin, source }

  function read(key) { try { var v = localStorage.getItem(key); return v == null ? null : JSON.parse(v); } catch (e) { return null; } }
  function say(text, cls) { msg.className = cls || "muted"; msg.textContent = text; }

  function buildBundle() {
    var settings = read(KEYS[0]), quotes = read(KEYS[1]), cal = read(KEYS[2]), cat = read(KEYS[3]);
    return window.EtabliCore.buildBackup(
      { settings: settings, quotes: Array.isArray(quotes) ? quotes : [], calepinage: cal, catalogue: Array.isArray(cat) ? cat : [] },
      { exportedAt: new Date().toISOString() }
    );
  }

  window.addEventListener("message", function (ev) {
    var d = ev.data;
    if (!d || d.type !== "etabli-migrate:request") return;
    if (targets.indexOf(ev.origin) < 0) { say("Cette adresse n'est pas autorisée à recevoir vos données (" + ev.origin + ").", "err"); return; }
    if (ev.source !== window.opener) return;
    pending = { origin: ev.origin, source: ev.source };
    document.getElementById("target").textContent = ev.origin;
    var b = buildBundle();
    say(b.data.quotes.length + " devis, " + b.data.catalogue.length + " article(s) de catalogue trouvés dans ce navigateur.");
    act.hidden = false;
  });

  document.getElementById("send").addEventListener("click", function () {
    if (!pending) return;
    pending.source.postMessage({ type: "etabli-migrate:data", backup: buildBundle() }, pending.origin);
    act.hidden = true;
    say("Données envoyées. Vous pouvez fermer cette fenêtre.", "ok");
    setTimeout(function () { window.close(); }, 1200);
  });
  document.getElementById("cancel").addEventListener("click", function () {
    if (pending) pending.source.postMessage({ type: "etabli-migrate:cancel" }, pending.origin);
    window.close();
  });

  if (!window.opener) { say("Ouvrez cette page depuis le serveur ÉTABLI (bouton « Récupérer mes données »).", "err"); return; }
  if (!targets.length) { say("La migration n'est pas configurée sur cette adresse.", "err"); return; }
  try { window.opener.postMessage({ type: "etabli-migrate:ready" }, "*"); } catch (e) { say("Fenêtre d'origine inaccessible.", "err"); }
})();
</script>
</body>
</html>
